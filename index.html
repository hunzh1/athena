<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15181c" media="(prefers-color-scheme: dark)">
<title>进销存系统</title>
<!-- 单文件版：样式与脚本全部内联，零外链，file:// 双击即可用 -->
<style>
/* styles.css — 界面重做 v2：卡片流（没有宽表），手机优先
 * 硬约束：触控 ≥44px / input ≥16px（防缩放）/ 100dvh / 底部安全区 / 410 无横向滚动
 */

:root {
  --bg: #f2f5f3;
  --bg2: #e7ede9;
  --card: #ffffff;
  --ink: #12211c;
  --ink2: #5f7169;
  --line: #dde5e0;
  --brand: #0f7a5a;
  --brand-ink: #ffffff;
  --pos: #0b7a58;
  --danger: #bd3a2f;
  --warn: #a86400;
  --shadow: 0 1px 2px rgba(16, 36, 30, .05), 0 8px 22px rgba(16, 36, 30, .05);
  --nav-h: 56px;
  --dock-h: 56px;
  --r: 14px;
  color-scheme: light;
}
[data-theme="dark"] {
  --bg: #0f1513;
  --bg2: #172120;
  --card: #18221f;
  --ink: #e9f1ed;
  --ink2: #9db1a8;
  --line: #26332e;
  --brand: #3ac99b;
  --brand-ink: #06110d;
  --pos: #55dcb0;
  --danger: #ff8f7f;
  --warn: #ffc46a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 10px 26px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100dvh;
  min-height: -webkit-fill-available;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  overflow-x: hidden;
}

#app { min-height: 100dvh; min-height: -webkit-fill-available; }

button { font: inherit; color: inherit; cursor: pointer; }
h1, h2, p, ul { margin: 0; }
ul { padding: 0; list-style: none; }

/* ---------- 顶栏 ---------- */
.appbar {
  position: sticky;
  top: 0;
  z-index: 30;
  padding-top: env(safe-area-inset-top);
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.appbar-in {
  display: flex;
  align-items: center;
  gap: 10px;
  height: 54px;
  max-width: 1440px;
  margin: 0 auto;
  padding: 0 12px;
}
.appbar h1 {
  flex: 1;
  min-width: 0;
  font-size: 18px;
  font-weight: 700;
  letter-spacing: .5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.appbar-sp { width: 44px; }

.iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
}
.iconbtn.sm { width: 38px; height: 38px; border-radius: 10px; }
.iconbtn:active { transform: scale(.96); }

/* ---------- 备份提醒条 ---------- */
.banner {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  background: var(--bg2);
  border-bottom: 1px solid var(--line);
  font-size: 13px;
  color: var(--ink2);
}
.banner-ic { display: flex; color: var(--warn); flex: 0 0 auto; }
.banner-tx { flex: 1; min-width: 0; }
.banner-go {
  flex: 0 0 auto;
  min-height: 36px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  font-size: 13px;
  font-weight: 700;
}
.banner-x {
  flex: 0 0 auto;
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  background: none;
  color: var(--ink2);
}

/* ---------- 主区 ---------- */
.main {
  max-width: 1440px;
  margin: 0 auto;
  padding: 12px 12px calc(var(--nav-h) + var(--dock-h) + env(safe-area-inset-bottom) + 26px);
}
.main.set { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 26px); }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 12px;
}
.grid.kpis { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

/* ---------- KPI ---------- */
.kpi {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  padding: 10px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow);
}
.kpi-l { font-size: 12px; font-weight: 600; color: var(--ink2); }
.kpi-v {
  font-size: 22px;
  font-weight: 750;
  letter-spacing: -.4px;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.kpi-v small { margin-left: 3px; font-size: 11px; font-weight: 600; color: var(--ink2); }
.pos { color: var(--pos); }
.danger { color: var(--danger); }
.warn { color: var(--warn); }

/* ---------- 区块标题 / 空态 ---------- */
.sec-hd {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
  margin: 18px 2px 8px;
}
.sec-hd h2 { font-size: 14px; font-weight: 700; letter-spacing: .3px; }
.sec-note { font-size: 12px; color: var(--ink2); }
.empty {
  padding: 16px;
  text-align: center;
  font-size: 14px;
  color: var(--ink2);
  background: var(--card);
  border: 1px dashed var(--line);
  border-radius: 12px;
}

/* ---------- 卡片 ---------- */
.card {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-width: 0;
  padding: 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r);
  box-shadow: var(--shadow);
}
.card-hd { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.card-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.card-ttl {
  min-width: 0;
  font-size: 15px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-sub {
  min-width: 0;
  font-size: 12px;
  color: var(--ink2);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.card-ft { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card-ft.wrap { flex-wrap: wrap; }
.card.off { opacity: .6; }
.card.new { border-style: dashed; border-color: var(--brand); max-width: 620px; }
.card.guide { max-width: 640px; }
.guide p { font-size: 14px; color: var(--ink2); }
.card.list { padding: 0; gap: 0; overflow: hidden; }

/* ---------- 行（榜单） ---------- */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  min-height: 54px;
  padding: 10px 14px;
  border: 0;
  border-top: 1px solid var(--line);
  background: none;
  text-align: left;
}
.row:first-child { border-top: 0; }
.row:active { background: var(--bg2); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-main b { font-size: 15px; }
.row-main small { font-size: 12px; color: var(--ink2); }
.row-val {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 0 0 auto;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* ---------- 按钮 ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--card);
  color: var(--ink);
  font-size: 15px;
  font-weight: 650;
  white-space: nowrap;
}
.btn.primary { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--danger); background: var(--danger); color: #fff; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
.btn[disabled] { opacity: .42; pointer-events: none; }
.link {
  min-height: 36px;
  padding: 6px 4px;
  border: 0;
  background: none;
  color: var(--brand);
  font-size: 14px;
  font-weight: 650;
}
.link.danger { color: var(--danger); }
:where(button, input, select, textarea, [tabindex]):focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

/* ---------- 表单 ---------- */
input, select, textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-size: 16px;
  touch-action: manipulation;
}
textarea { min-height: 96px; resize: vertical; font-size: 16px; }
select { -webkit-appearance: menulist; appearance: menulist; padding-right: 8px; }
input[disabled] { background: var(--bg2); color: var(--ink2); }
input[type="number"] { -moz-appearance: textfield; }
input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
input[type="date"] { min-height: 44px; }

.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.fld > span { font-size: 12px; font-weight: 600; color: var(--ink2); letter-spacing: .2px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-width: 0; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; min-width: 0; }
.hint { font-size: 12px; line-height: 1.5; color: var(--ink2); }
.hint.err { color: var(--danger); font-weight: 700; }

/* ---------- 搜索 / 过滤 ---------- */
.searchbar { position: relative; margin: 12px 0 4px; }
.searchbar input { padding-left: 40px; }
.search-ico {
  position: absolute;
  left: 13px;
  top: 50%;
  display: flex;
  transform: translateY(-50%);
  color: var(--ink2);
  pointer-events: none;
}
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 12px; }
.chip {
  min-height: 38px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink2);
  font-size: 13px;
  font-weight: 650;
}
.chip.on { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); }

/* ---------- 段状开关 ---------- */
.seg {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--bg2);
  border-radius: 12px;
}
.seg button {
  flex: 1;
  min-height: 44px;
  border: 0;
  border-radius: 9px;
  background: transparent;
  color: var(--ink2);
  font-size: 15px;
  font-weight: 650;
}
.seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.seg.small button { min-height: 40px; font-size: 14px; }

/* ---------- 统计条 ---------- */
.strip { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0 6px; }
.strip > div {
  flex: 1 1 100px;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 12px;
}
.strip small { font-size: 12px; color: var(--ink2); }
.strip b { font-size: 18px; font-variant-numeric: tabular-nums; }

/* ---------- 库存 ---------- */
.stock-num {
  display: flex;
  align-items: baseline;
  gap: 6px;
  min-height: 56px;
  padding: 4px 0;
  border: 0;
  background: none;
  text-align: left;
}
.stock-num b { font-size: 34px; line-height: 1; letter-spacing: -.8px; font-variant-numeric: tabular-nums; }
.stock-num small { font-size: 14px; color: var(--ink2); }
.stock-num:active b { transform: scale(.97); }

.stat-chip {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 9px;
  border-radius: 999px;
  background: var(--bg2);
  color: var(--ink2);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.s-紧缺 { background: #fdecea; color: #b9382c; }
.s-偏低 { background: #fff3df; color: #a86400; }
.s-充足 { background: #e8f5ef; color: #0b7a58; }
.s-无货 { background: #f1e9ff; color: #6a3fa2; }
[data-theme="dark"] .s-紧缺 { background: #3a1f1c; color: #ff9c8e; }
[data-theme="dark"] .s-偏低 { background: #33280f; color: #ffc46a; }
[data-theme="dark"] .s-充足 { background: #123328; color: #55dcb0; }
[data-theme="dark"] .s-无货 { background: #251b38; color: #c9a6ff; }

/* ---------- 价格 ---------- */
/* ---------- 价格页：一行一个产品 ---------- */
.grid.rows { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 8px; }
.card.prow { padding: 9px 12px; gap: 3px; cursor: pointer; min-height: 0; }
.prow-top { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.prow-nm { flex: 1; min-width: 0; font-size: 15.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow-off { flex: 0 0 auto; font-size: 11px; line-height: 16px; color: var(--ink2); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px; }
.prow-ret { flex: 0 0 auto; display: flex; align-items: baseline; gap: 4px; color: var(--brand); font-variant-numeric: tabular-nums; }
.prow-ret small { font-size: 11px; color: var(--ink2); }
.prow-ret b { font-size: 17px; font-weight: 750; letter-spacing: -.2px; }
.prow-ret b.none { font-size: 12.5px; font-weight: 600; color: var(--warn); letter-spacing: 0; }
.prow-sub { display: flex; align-items: baseline; gap: 10px; min-width: 0; font-size: 12px; color: var(--ink2); font-variant-numeric: tabular-nums; }
.prow-sub .prow-cat { margin-left: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-fld { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.p-fld span { font-size: 11px; font-weight: 650; color: var(--ink2); }
.p-fld input { min-height: 44px; padding: 8px 10px; }

/* ---------- 客户三数 ---------- */
.tri { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; min-width: 0; }
.tri-i {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  padding: 8px;
  background: var(--bg2);
  border-radius: 10px;
}
.tri-i small { font-size: 11px; color: var(--ink2); }
.tri-i b {
  font-size: 17px;
  font-variant-numeric: tabular-nums;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.note-edit { display: flex; align-items: center; gap: 8px; min-width: 0; }
.note-edit span { flex: 0 0 auto; font-size: 11px; font-weight: 650; color: var(--ink2); }
.note-edit input { min-height: 40px; font-size: 16px; }

/* ---------- 单据卡 ---------- */
.amt { flex: 0 0 auto; font-size: 16px; font-weight: 750; font-variant-numeric: tabular-nums; white-space: nowrap; }
.lines { display: flex; flex-direction: column; gap: 6px; }
.lines li { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--ink2); }
.lines li span:first-child {
  min-width: 0;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.lines li span:last-child { flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--ink2); }
.nums {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 8px 10px;
  background: var(--bg2);
  border-radius: 10px;
}
.nums > div { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.nums small { font-size: 11px; color: var(--ink2); }
.nums b { font-size: 16px; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.badge {
  display: inline-flex;
  align-items: center;
  height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 750;
  white-space: nowrap;
}
.badge.bal { background: #e8f5ef; color: #0b7a58; }
.badge.pt { background: #fff1e0; color: #a86400; }
[data-theme="dark"] .badge.bal { background: #123328; color: #55dcb0; }
[data-theme="dark"] .badge.pt { background: #33280f; color: #ffc46a; }

/* ---------- 积分 ---------- */
.flow-row {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border-top: 1px solid var(--line);
}
.flow-row:first-child { border-top: 0; }
.flow-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.flow-main b { font-size: 14px; }
.flow-main small {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 12px;
  color: var(--ink2);
}
.flow-delta { flex: 0 0 auto; font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
.flow-delta.pos { color: var(--pos); }
.flow-delta.neg { color: var(--danger); }

/* ---------- 底部导航 ---------- */
.tabbar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 40;
  display: flex;
  min-height: var(--nav-h);
  padding-bottom: env(safe-area-inset-bottom);
  background: var(--card);
  border-top: 1px solid var(--line);
}
.tab {
  flex: 1 1 0;
  min-width: 0;
  min-height: 56px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 6px 2px;
  border: 0;
  background: none;
  color: var(--ink2);
  font-size: 11px;
  font-weight: 600;
}
.tab.on { color: var(--brand); }
.tab .ti { display: flex; }
.tl { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ts { display: none; }

/* ---------- 主按钮（底部安全区上方） ---------- */
.dock {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
  z-index: 39;
  display: flex;
  justify-content: center;
  padding: 0 12px 8px;
  pointer-events: none;
}
.dock .btn {
  width: 100%;
  max-width: 520px;
  height: 48px;
  pointer-events: auto;
  box-shadow: 0 6px 18px rgba(16, 36, 30, .18);
}

/* ---------- 仪表盘双栏（宽屏） ---------- */
.dash-cols { display: grid; gap: 0 18px; }
.dcol { min-width: 0; }

/* ---------- 弹层 ---------- */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 90;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(8, 18, 14, .48);
}
.sheet-panel {
  display: flex;
  flex-direction: column;
  width: 100%;
  max-width: 640px;
  max-height: calc(100dvh - 20px);
  background: var(--card);
  border-radius: 18px 18px 0 0;
  box-shadow: 0 -8px 40px rgba(0, 0, 0, .3);
}
.sheet-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px 8px 16px;
  border-bottom: 1px solid var(--line);
}
.sheet-hd h2 { flex: 1; min-width: 0; font-size: 16px; font-weight: 700; }
.sheet-body {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 12px 16px calc(68px + env(safe-area-inset-bottom));
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.sheet-foot {
  display: flex;
  gap: 10px;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  border-top: 1px solid var(--line);
  background: var(--card);
}
.sheet-foot .btn { flex: 1; height: 48px; }
body.sheet-open { overflow: hidden; }
.who {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 8px 12px;
  background: var(--bg2);
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
}
.who small { font-size: 12px; font-weight: 500; color: var(--ink2); }
.lines-edit { display: flex; flex-direction: column; gap: 10px; }
.line-edit {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border: 1px dashed var(--line);
  border-radius: 12px;
}

/* ---------- 设置 ---------- */
.main.set { display: flex; flex-direction: column; gap: 12px; }
.main.set .card + .card { margin-top: 0; }
.edits { display: flex; flex-direction: column; }
.edits li {

  padding: 8px 0;
  border-top: 1px solid var(--line);

}
.edits li:first-child { border-top: 0; }
.edits li span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edits small { flex: 0 0 auto; color: var(--ink2); }
.danger-zone { border-color: var(--danger); }
.danger-zone p { font-size: 14px; color: var(--ink2); }

/* ---------- toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(var(--nav-h) + var(--dock-h) + env(safe-area-inset-bottom) + 16px);
  z-index: 80;
  max-width: min(92vw, 560px);
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(10, 22, 18, .95);
  color: #fff;
  font-size: 14px;
  line-height: 1.4;
  opacity: 0;
  transform: translate(-50%, 12px);
  transition: opacity .18s ease, transform .18s ease;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: #8d2b23; }

.fatal { padding: 24px; font-size: 15px; line-height: 1.6; }

/* ---------- 窄屏 ---------- */

  .ts { display: block; }
  .main { padding-left: 10px; padding-right: 10px; }

}

/* ---------- 宽屏：弹层变居中对话框 ---------- */

}

@media (min-width: 760px) {

}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

      var p = pm[line.productId] || {};
      var q = num(line.qty);
      var snap = line.costPriceSnapshot != null ? round2(line.costPriceSnapshot)
        : (doc && doc.docType === '盘点' ? 0 : round2(p.costPrice));
      t.qty = qty3(t.qty + q);
      t.amount = round2(t.amount + docLineAmount(line));
      t.costValue = round2(t.costValue + snap * q);
      t.lineCount += 1;
    });
    if (doc && doc.docType === '出货') {
      t.paidFromBalance = round2(doc.paidFromBalance);
      t.debt = round2(doc.debt);
      t.pointsUsed = Math.round(num(doc.pointsUsed));
    }
    return t;
  }

  /* ============================ 5. 账户派生口径（唯一实现处） ============================ */

  /**
   * 客户账户：
   *   balance = Σ充值 − Σ(余额单实扣余额)
   *   rawDebt = Σ出货单欠款 − Σ收款；debt = max(0, rawDebt)
   *   points  = Σ积分流水 delta − Σ(积分单) pointsUsed
   * 空账本 / 查无此人一律返回全 0，不抛错（界面首屏会先开账户卡）。
   */
  function customerAccount(db, customerId, todayIn) {
    var cid = String(customerId == null ? '' : customerId);
    var out = {
      balance: 0, points: 0, debt: 0, depositTotal: 0, receiptTotal: 0,
      pointsUsedByDocs: 0, pointsAdded: 0, rawDebt: 0, lastDate: ''
    };
    var last = '';
    function touch(d) { if (isDateStr(d) && d > last) last = d; }

    ((db && db.deposits) || []).forEach(function (x) {
      if (String(x.customerId) !== cid) return;
      out.depositTotal = round2(out.depositTotal + num(x.amount));
      touch(x.date);
    });
    ((db && db.receipts) || []).forEach(function (x) {
      if (String(x.customerId) !== cid) return;
      out.receiptTotal = round2(out.receiptTotal + num(x.amount));
      touch(x.date);
    });
    ((db && db.pointLogs) || []).forEach(function (x) {
      if (String(x.customerId) !== cid) return;
      out.pointsAdded += Math.round(num(x.delta));
      touch(x.date);
    });

    var paidTotal = 0, debtTotal = 0;
    ((db && db.docs) || []).forEach(function (doc) {
      if (!doc || doc.docType !== '出货') return;
      if (String(doc.partnerId || '') !== cid) return;
      if (doc.payKind === '积分') out.pointsUsedByDocs += Math.round(num(doc.pointsUsed));
      else {
        paidTotal = round2(paidTotal + num(doc.paidFromBalance));
        debtTotal = round2(debtTotal + num(doc.debt));
      }
      touch(doc.date);
    });

    out.balance = round2(out.depositTotal - paidTotal);
    out.rawDebt = round2(debtTotal - out.receiptTotal);
    out.debt = Math.max(0, out.rawDebt);
    out.points = out.pointsAdded - out.pointsUsedByDocs;
    out.lastDate = last;
    return out;
  }

  function allAccounts(db, todayIn) {
    return ((db && db.customers) || []).map(function (c) {
      var acc = customerAccount(db, c.id, todayIn);
      return {
        customerId: c.id,
        name: c.name,
        active: c.active !== false,
        balance: acc.balance,
        points: acc.points,
        debt: acc.debt,
        depositTotal: acc.depositTotal,
        receiptTotal: acc.receiptTotal,
        pointsUsedByDocs: acc.pointsUsedByDocs,
        pointsAdded: acc.pointsAdded,
        rawDebt: acc.rawDebt,
        lastDate: acc.lastDate
      };
    });
  }

  /* ============================ 6. 台账写入（充值 / 收款 / 积分） ============================ */

  function addDeposit(db, spec) {
    var s = spec || {};
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.deposits)) next.deposits = [];
    var cid = s.customerId ? String(s.customerId) : '';
    if (!cid) return err('NO_CUSTOMER', '先选客户');
    if (!findCustomer(next, cid)) return err('CUSTOMER_NOT_FOUND', '没有这个客户');
    var amount = round2(s.amount);
    if (!(amount > 0)) return err('BAD_AMOUNT', '充值金额要大于 0');
    var date = isDateStr(s.date) ? s.date : todayStr();
    var rec = {
      id: nextDepositId(next),
      no: makeDayNo(next.deposits, 'CZ', date),
      customerId: cid,
      date: date,
      amount: amount,
      note: typeof s.note === 'string' ? s.note : '',
      at: typeof s.at === 'string' && s.at ? s.at : nowStamp()
    };
    next.deposits.push(rec);
    return { db: next, id: rec.id, no: rec.no };
  }

  function addReceipt(db, spec) {
    var s = spec || {};
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.receipts)) next.receipts = [];
    var cid = s.customerId ? String(s.customerId) : '';
    if (!cid) return err('NO_CUSTOMER', '先选客户');
    if (!findCustomer(next, cid)) return err('CUSTOMER_NOT_FOUND', '没有这个客户');
    var amount = round2(s.amount);
    if (!(amount > 0)) return err('BAD_AMOUNT', '收款金额要大于 0');
    var date = isDateStr(s.date) ? s.date : todayStr();
    var debtBefore = customerAccount(next, cid, date).debt;
    var rec = {
      id: nextReceiptId(next),
      no: makeDayNo(next.receipts, 'SK', date),
      customerId: cid,
      date: date,
      amount: amount,
      note: typeof s.note === 'string' ? s.note : '',
      at: typeof s.at === 'string' && s.at ? s.at : nowStamp()
    };
    next.receipts.push(rec);
    return { db: next, id: rec.id, no: rec.no, over: amount > debtBefore + 1e-9 };
  }

  function pointAdjust(db, spec) {
    var s = spec || {};
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.pointLogs)) next.pointLogs = [];
    var cid = s.customerId ? String(s.customerId) : '';
    if (!cid) return err('NO_CUSTOMER', '先选客户');
    if (!findCustomer(next, cid)) return err('CUSTOMER_NOT_FOUND', '没有这个客户');
    var delta = typeof s.delta === 'number' ? s.delta : parseFloat(s.delta);
    if (!isFinite(delta) || Math.round(delta) !== delta) return err('BAD_DELTA', '积分要填整数');
    delta = Math.round(delta);
    if (delta === 0) return err('BAD_DELTA', '积分不能填 0');
    var reason = String(s.reason == null ? '' : s.reason).trim();
    if (!reason) return err('BAD_REASON', '加减积分必须写原因');
    var date = isDateStr(s.date) ? s.date : todayStr();
    var before = customerAccount(next, cid, date).points;
    var rec = {
      id: nextPointId(next),
      no: makeDayNo(next.pointLogs, 'JF', date),
      customerId: cid,
      date: date,
      delta: delta,
      reason: reason.slice(0, 120),
      at: typeof s.at === 'string' && s.at ? s.at : nowStamp()
    };
    next.pointLogs.push(rec);
    return { db: next, id: rec.id, no: rec.no, negativeAfter: before + delta < 0 };
  }

  /* ============================ 7. 单据写入 ============================ */

  function buildOutLines(next, draft, payKind, tier) {
    var pm = productMap(next);
    var rawLines = Array.isArray(draft.lines) ? draft.lines : [];
    if (!rawLines.length) return err('EMPTY_LINES', '这一单还没有产品行');
    var lines = [];
    for (var i = 0; i < rawLines.length; i++) {
      var raw = rawLines[i] || {};
      var pid = raw.productId ? String(raw.productId) : '';
      var qty = qty3(raw.qty);
      if (!pid) return err('BAD_LINE', '有一行没选产品');
      if (!(qty > 0)) return err('BAD_LINE', '数量要大于 0');
      var p = pm[pid];
      if (!p) return err('PRODUCT_NOT_FOUND', '没有这个产品：' + pid);
      var unitPrice, override;
      if (payKind === '积分') {
        unitPrice = round2(p.retailPrice);
        override = false;
      } else if (raw.unitPrice != null && raw.unitPrice !== '' && isFinite(Number(raw.unitPrice))) {
        unitPrice = round2(Math.max(0, Number(raw.unitPrice)));
        override = true;
      } else {
        unitPrice = tierPrice(p, tier);
        override = String(tier || '') !== '' && String(tier) !== '门店价';
      }
      lines.push({
        productId: pid,
        qty: qty,
        unitPrice: unitPrice,
        amount: round2(qty * unitPrice),
        costPriceSnapshot: round2(p.costPrice),
        priceOverride: override
      });
    }
    return { lines: lines };
  }

  function sumLines(lines) {
    var total = 0;
    (lines || []).forEach(function (l) { total = round2(total + docLineAmount(l)); });
    return total;
  }

  /**
   * 保存一张出货单。draft = { date, partnerId, partnerName, payKind, discountTier, note,
   *   lines:[{productId, qty, unitPrice?}], paidFromBalance?, at? }
   * 余额单：unitPrice 用传入值（没传就按折扣档/门店价），实扣默认 min(余额, 金额)，差额记 debt。
   * 积分单：unitPrice 强制 = retailPrice，pointsUsed = Σ金额取整，积分不够直接拒单。
   */
  function saveOutDoc(db, draft) {
    var d = draft || {};
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.docs)) next.docs = [];
    var cid = d.partnerId ? String(d.partnerId) : '';
    if (!cid) return err('NO_CUSTOMER', '先选客户：余额单和积分单都要记在某个客户头上');
    var cust = findCustomer(next, cid);
    if (!cust) return err('CUSTOMER_NOT_FOUND', '没有这个客户');
    var payKind = PAY_KINDS.indexOf(d.payKind) >= 0 ? d.payKind : '余额';
    var tier = String(d.discountTier == null ? '' : d.discountTier);
    if (DISCOUNT_TIERS.indexOf(tier) < 0) tier = '门店价';

    var built = buildOutLines(next, d, payKind, tier);
    if (built.error) return built;
    var lines = built.lines;
    var total = sumLines(lines);

    var date = isDateStr(d.date) ? d.date : todayStr();
    var doc = {
      id: d.id ? String(d.id) : nextDocId(next),
      no: d.no ? String(d.no) : makeDocNo(next, date),
      docType: '出货',
      date: date,
      partnerId: cid,
      partnerName: String(d.partnerName || cust.name || ''),
      payKind: payKind,
      discountTier: tier,
      paidFromBalance: 0,
      debt: 0,
      pointsUsed: 0,
      note: d.note == null ? '' : String(d.note),
      lines: lines
    };

    var acc = customerAccount(next, cid, date);
    if (payKind === '积分') {
      var need = Math.round(total);
      if (need > acc.points) {
        return {
          error: 'INSUFFICIENT_POINTS',
          code: 'INSUFFICIENT_POINTS',
          message: '他现在 ' + acc.points + ' 分，这单要 ' + need + ' 分'
        };
      }
      doc.pointsUsed = need;
    } else {
      var paid;
      if (d.paidFromBalance != null && d.paidFromBalance !== '') {
        paid = round2(d.paidFromBalance);
        if (!isFinite(Number(d.paidFromBalance)) || paid < 0) return err('BAD_PAID', '实扣余额要填 0 或正数');
        if (paid > acc.balance + 1e-9) {
          return {
            error: 'OVER_BALANCE',
            code: 'OVER_BALANCE',
            message: '余额不够：他现在 ' + fmt(acc.balance) + '，这单最多扣 ' + fmt(acc.balance)
          };
        }
        if (paid > total) paid = total; /* 一单最多把这张单的金额付完，多出来的不算扣款 */
      } else {
        paid = round2(Math.min(Math.max(0, acc.balance), total));
      }
      doc.paidFromBalance = paid;
      doc.debt = round2(total - paid);
    }

    next.docs.push(doc);
    return { db: next, doc: doc };
  }

  /** 保存一张进货单：单价 = 产品进货价（成本价），库存由 inventory 回放 +qty */
  function saveInDoc(db, draft) {
    var d = draft || {};
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.docs)) next.docs = [];
    var pm = productMap(next);
    var rawLines = Array.isArray(d.lines) ? d.lines : [];
    if (!rawLines.length) return err('EMPTY_LINES', '这一单还没有产品行');
    var lines = [];
    for (var i = 0; i < rawLines.length; i++) {
      var raw = rawLines[i] || {};
      var pid = raw.productId ? String(raw.productId) : '';
      var qty = qty3(raw.qty);
      if (!pid) return err('BAD_LINE', '有一行没选产品');
      if (!(qty > 0)) return err('BAD_LINE', '数量要大于 0');
      var p = pm[pid];
      if (!p) return err('PRODUCT_NOT_FOUND', '没有这个产品：' + pid);
      var unitCost = round2(p.costPrice);
      lines.push({
        productId: pid,
        qty: qty,
        unitPrice: unitCost,
        amount: round2(qty * unitCost),
        costPriceSnapshot: unitCost,
        priceOverride: false
      });
    }
    var date = isDateStr(d.date) ? d.date : todayStr();
    var doc = {
      id: d.id ? String(d.id) : nextDocId(next),
      no: d.no ? String(d.no) : makeDocNo(next, date),
      docType: '进货',
      date: date,
      partnerId: null,
      partnerName: String(d.partnerName || '总部'),
      payKind: null,
      discountTier: '',
      paidFromBalance: 0,
      debt: 0,
      pointsUsed: 0,
      note: d.note == null ? '' : String(d.note),
      lines: lines
    };
    next.docs.push(doc);
    return { db: next, doc: doc };
  }

  /** 盘点单：lines 的 qty 是差量（可正可负、非 0），金额恒 0，不动钱也不动成本 */
  function saveCount(db, draft) {
    var d = draft || {};
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.docs)) next.docs = [];
    var pm = productMap(next);
    var rawLines = Array.isArray(d.lines) ? d.lines : [];
    if (!rawLines.length) return err('EMPTY_LINES', '这一单还没有产品行');
    var lines = [];
    for (var i = 0; i < rawLines.length; i++) {
      var raw = rawLines[i] || {};
      var pid = raw.productId ? String(raw.productId) : '';
      if (!pid) return err('BAD_LINE', '有一行没选产品');
      if (!pm[pid]) return err('PRODUCT_NOT_FOUND', '没有这个产品：' + pid);
      if (!isFinite(num(raw.qty))) return err('BAD_QTY', '数量要填数字');
      var qty = qty3(raw.qty);
      if (qty === 0) return err('ZERO_QTY', '盘点填的是差量，0 就不用记账了');
      lines.push({ productId: pid, qty: qty, unitPrice: 0, amount: 0, costPriceSnapshot: null, priceOverride: false });
    }
    var date = isDateStr(d.date) ? d.date : todayStr();
    var doc = {
      id: d.id ? String(d.id) : nextDocId(next),
      no: d.no ? String(d.no) : makeDayNo(next.docs, 'PD', date),
      docType: '盘点',
      date: date,
      partnerId: null,
      partnerName: '',
      payKind: null,
      discountTier: '',
      paidFromBalance: 0,
      debt: 0,
      pointsUsed: 0,
      note: d.note == null ? '' : String(d.note),
      at: d.at == null || d.at === '' ? nowStamp() : String(d.at),
      lines: lines
    };
    next.docs.push(doc);
    return { db: next, doc: doc };
  }

  /** 改一张已落盘的单：先把原单摘掉，再按同一 id/no 重新走保存（余额/积分校验不含它自己） */
  function updateDoc(db, draft) {
    var d = draft || {};
    var id = String(d.id || '');
    if (!id) return err('NO_DOC', '要改哪张单？');
    var next = clone(db) || emptyDb();
    var idx = -1;
    (next.docs || []).forEach(function (x, i) { if (idx < 0 && String(x.id) === id) idx = i; });
    if (idx < 0) return err('DOC_NOT_FOUND', '找不到这张单');
    var old = next.docs[idx];
    next.docs.splice(idx, 1);
    var payload = Object.assign({}, d, { id: old.id, no: old.no });
    var res = d.docType === '进货' ? saveInDoc(next, payload)
      : (d.docType === '盘点' ? saveCount(next, payload) : saveOutDoc(next, payload));
    if (res.error) return res;
    /* saveInDoc / saveOutDoc 已经把新版本追加进 docs，这里不要再插一次 */
    return { db: res.db, doc: res.doc };
  }

  function deleteDoc(db, docId) {
    var next = clone(db) || emptyDb();
    var before = (next.docs || []).length;
    var id = String(docId == null ? '' : docId);
    next.docs = (next.docs || []).filter(function (d) { return String(d.id) !== id; });
    return { db: next, removed: before - next.docs.length };
  }

  /* ============================ 8. 产品 / 客户档案 ============================ */

  function upsertProduct(db, product) {
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.products)) next.products = [];
    var p = normProduct(product);
    if (!p) throw new Error('产品名不能为空');
    var id = String(product && product.id ? product.id : '');
    var idx = -1;
    next.products.forEach(function (x, i) { if (x.id === id) idx = i; });
    if (idx >= 0) next.products[idx] = Object.assign({}, p, { id: id });
    else next.products.push(Object.assign({}, p, { id: id || nextProductId(next) }));
    return next;
  }

  /** 有历史单据的产品只停用，不物理删除（否则历史账查不到名字） */
  function deleteProduct(db, productId) {
    var next = clone(db) || emptyDb();
    var used = productDocCount(next, productId) > 0;
    if (used) {
      next.products = (next.products || []).map(function (p) {
        return p.id === productId ? Object.assign({}, p, { active: false }) : p;
      });
    } else {
      next.products = (next.products || []).filter(function (p) { return p.id !== productId; });
    }
    return next;
  }

  function upsertCustomer(db, customer) {
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.customers)) next.customers = [];
    var c = normCustomer(customer);
    if (!c) throw new Error('客户名不能为空');
    var id = String(customer && customer.id ? customer.id : '');
    var idx = -1;
    next.customers.forEach(function (x, i) { if (x.id === id) idx = i; });
    if (idx >= 0) next.customers[idx] = Object.assign({}, c, { id: id });
    else next.customers.push(Object.assign({}, c, { id: id || nextCustomerId(next) }));
    return next;
  }

  function deleteCustomer(db, customerId) {
    var next = clone(db) || emptyDb();
    var used = customerDocCount(next, customerId) > 0;
    if (used) {
      next.customers = (next.customers || []).map(function (c) {
        return String(c.id) === String(customerId) ? Object.assign({}, c, { active: false }) : c;
      });
    } else {
      next.customers = (next.customers || []).filter(function (c) { return String(c.id) !== String(customerId); });
    }
    return next;
  }

  function autoProductName(db) {
    var n = 1, names = {};
    ((db && db.products) || []).forEach(function (p) { names[p.name] = 1; });
    while (names['新产品' + (n > 1 ? n : '')]) n++;
    return '新产品' + (n > 1 ? n : '');
  }

  function autoCustomerName(db) {
    var n = 1, names = {};
    ((db && db.customers) || []).forEach(function (c) { names[c.name] = 1; });
    while (names['新客户' + (n > 1 ? n : '')]) n++;
    return '新客户' + (n > 1 ? n : '');
  }

  function applyProductFields(p, fields, dbForName) {
    var f = fields || {};
    if (f.name !== undefined) {
      var nm = String(f.name == null ? '' : f.name).trim();
      if (!nm) {
        if (!dbForName) throw new Error('产品名不能为空');
        nm = autoProductName(dbForName);
      }
      p.name = nm;
    }
    if (f.category !== undefined) p.category = String(f.category || '').trim() || '面部';
    if (f.sub !== undefined) p.sub = String(f.sub || '');
    if (f.unit !== undefined) p.unit = String(f.unit || '').trim() || '套';
    if (f.note !== undefined) p.note = String(f.note == null ? '' : f.note);
    ['costPrice', 'storePrice', 'retailPrice'].forEach(function (k) {
      if (f[k] === undefined) return;
      var v = round2(num(f[k]));
      if (!isFinite(v) || v < 0) throw new Error('价格要填 0 或正数');
      p[k] = v;
    });
    if (f.active !== undefined) p.active = f.active === false ? false : true;
    return p;
  }

  function addProduct(db, fields) {
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.products)) next.products = [];
    var p = normProduct({ id: nextProductId(next), name: autoProductName(next), category: '面部',
      sub: '', unit: '套', costPrice: 0, storePrice: 0, retailPrice: 0, active: true, note: '' });
    applyProductFields(p, fields, next);
    next.products.push(p);
    return { db: next, id: p.id, name: p.name };
  }

  function updateProduct(db, productId, fields) {
    var next = clone(db) || emptyDb();
    var idx = -1;
    (next.products || []).forEach(function (p, i) { if (idx < 0 && String(p.id) === String(productId)) idx = i; });
    if (idx < 0) throw new Error('没有这个产品');
    applyProductFields(next.products[idx], fields, null);
    return { db: next, id: next.products[idx].id, name: next.products[idx].name };
  }

  function removeProduct(db, productId) {
    var next = clone(db) || emptyDb();
    var p = findProduct(next, productId);
    if (!p) throw new Error('没有这个产品');
    var used = productDocCount(next, productId);
    if (used > 0) {
      next.products = (next.products || []).map(function (x) {
        return String(x.id) === String(productId) ? Object.assign({}, x, { active: false }) : x;
      });
      return { db: next, mode: 'deactivated', docCount: used, name: p.name };
    }
    next.products = (next.products || []).filter(function (x) { return String(x.id) !== String(productId); });
    return { db: next, mode: 'deleted', docCount: 0, name: p.name };
  }

  function applyCustomerFields(c, fields, dbForName) {
    var f = fields || {};
    if (f.name !== undefined) {
      var nm = String(f.name == null ? '' : f.name).trim();
      if (!nm) {
        if (!dbForName) throw new Error('客户名不能为空');
        nm = autoCustomerName(dbForName);
      }
      c.name = nm;
    }
    if (f.note !== undefined) c.note = String(f.note == null ? '' : f.note);
    if (f.active !== undefined) c.active = f.active === false ? false : true;
    return c;
  }

  function addCustomer(db, fields) {
    var next = clone(db) || emptyDb();
    if (!Array.isArray(next.customers)) next.customers = [];
    var c = normCustomer({ id: nextCustomerId(next), name: autoCustomerName(next), note: '', active: true });
    applyCustomerFields(c, fields, next);
    next.customers.push(c);
    return { db: next, id: c.id, name: c.name };
  }

  function updateCustomer(db, customerId, fields) {
    var next = clone(db) || emptyDb();
    var idx = -1;
    (next.customers || []).forEach(function (c, i) { if (idx < 0 && String(c.id) === String(customerId)) idx = i; });
    if (idx < 0) throw new Error('没有这个客户');
    applyCustomerFields(next.customers[idx], fields, null);
    return { db: next, id: next.customers[idx].id, name: next.customers[idx].name };
  }

  function removeCustomer(db, customerId) {
    var next = clone(db) || emptyDb();
    var c = findCustomer(next, customerId);
    if (!c) throw new Error('没有这个客户');
    var used = customerDocCount(next, customerId);
    if (used > 0) {
      next.customers = (next.customers || []).map(function (x) {
        return String(x.id) === String(customerId) ? Object.assign({}, x, { active: false }) : x;
      });
      return { db: next, mode: 'deactivated', docCount: used, name: c.name };
    }
    next.customers = (next.customers || []).filter(function (x) { return String(x.id) !== String(customerId); });
    return { db: next, mode: 'deleted', docCount: 0, name: c.name };
  }

  function productDocCount(db, productId) {
    var id = String(productId == null ? '' : productId);
    return ((db && db.docs) || []).filter(function (d) {
      return (d.lines || []).some(function (l) { return String(l.productId) === id; });
    }).length;
  }

  /** 客户被引用多少次（单据 + 三本台账），决定「删除」还是「停用」 */
  function customerDocCount(db, customerId) {
    var id = String(customerId == null ? '' : customerId);
    var n = ((db && db.docs) || []).filter(function (d) { return String(d.partnerId || '') === id; }).length;
    ['deposits', 'receipts', 'pointLogs'].forEach(function (k) {
      n += ((db && db[k]) || []).filter(function (x) { return String(x.customerId || '') === id; }).length;
    });
    return n;
  }

  /* ============================ 9. 库存 / 成本回放 ============================ */

  function inventory(db) {
    var out = {};
    ((db && db.products) || []).forEach(function (p) { out[p.id] = { inHand: 0 }; });
    ((db && db.docs) || []).forEach(function (doc) {
      /* 进货 +、出货 −、盘点按差量（所以也是 +） */
      var dir = doc.docType === '进货' || doc.docType === '盘点' ? 1 : -1;
      (doc.lines || []).forEach(function (line) {
        var rec = out[line.productId] || (out[line.productId] = { inHand: 0 });
        rec.inHand = qty3(rec.inHand + dir * num(line.qty));
      });
    });
    return out;
  }

  function inventoryTotals(inv) {
    var t = { inHand: 0 };
    Object.keys(inv || {}).forEach(function (k) { t.inHand = qty3(t.inHand + num(inv[k].inHand)); });
    return t;
  }

  /** 按日期回放：移动加权成本、已售成本、积分单快照成本、月度汇总 */
  function replay(db) {
    var pm = productMap(db);
    var byProduct = {};
    var byMonth = {};
    var ledger = [];
    var totals = {
      docCount: 0, amount: 0, purchaseQty: 0, purchaseAmount: 0,
      saleQty: 0, saleAmount: 0, outAmount: 0, pointsQty: 0, pointsAmount: 0,
      revenue: 0, debtTotal: 0, soldCost: 0, pointsCost: 0, pointsUsed: 0, grossProfit: 0
    };

    function pstate(id) {
      if (!byProduct[id]) {
        var p = pm[id] || {};
        byProduct[id] = {
          productId: id, name: p.name || '', unit: p.unit || '',
          inHand: 0, avgCost: round2(p.costPrice),
          purchaseQty: 0, purchaseAmount: 0,
          saleQty: 0, saleAmount: 0, soldCost: 0,
          pointsQty: 0, pointsAmount: 0, pointsCost: 0
        };
      }
      return byProduct[id];
    }

    function mstate(ym) {
      if (!byMonth[ym]) {
        byMonth[ym] = {
          ym: ym, docCount: 0, docIds: [], amount: 0,
          purchaseQty: 0, purchaseAmount: 0,
          saleQty: 0, saleAmount: 0, outAmount: 0, pointsQty: 0, pointsAmount: 0,
          revenue: 0, debtTotal: 0, soldCost: 0, pointsCost: 0, pointsUsed: 0,
          grossProfit: 0, byProduct: {}, ledger: []
        };
      }
      return byMonth[ym];
    }

    sortedDocs(db).forEach(function (doc) {
      /* 盘点单只改在手数量（inventory 里算），财务回放完全不看它 */
      if (doc.docType === '盘点') return;
      var isIn = doc.docType === '进货';
      var ym = ymOf(doc.date);
      var ms = mstate(ym);
      var entry = {
        docId: doc.id, no: doc.no, date: doc.date, ym: ym, docType: doc.docType,
        payKind: doc.payKind || null, partnerId: doc.partnerId, partnerName: doc.partnerName,
        qty: 0, amount: 0, purchaseAmount: 0, saleAmount: 0, outAmount: 0, pointsAmount: 0,
        paidFromBalance: 0, debt: 0, pointsUsed: 0, revenue: 0, soldCost: 0, pointsCost: 0
      };
      ms.docCount += 1;
      ms.docIds.push(doc.id);

      (doc.lines || []).forEach(function (line) {
        var p = pm[line.productId] || {};
        var st = pstate(line.productId);
        var q = num(line.qty);
        var amount = docLineAmount(line);
        entry.qty = qty3(entry.qty + q);
        entry.amount = round2(entry.amount + amount);
        ms.amount = round2(ms.amount + amount);
        totals.amount = round2(totals.amount + amount);

        if (!ms.byProduct[line.productId]) {
          ms.byProduct[line.productId] = {
            productId: line.productId, name: p.name || '', unit: p.unit || '',
            qty: 0, amount: 0, soldCost: 0, pointsCost: 0
          };
        }
        var mb = ms.byProduct[line.productId];
        mb.qty = qty3(mb.qty + q);
        mb.amount = round2(mb.amount + amount);

        if (isIn) {
          var unitCost = line.costPriceSnapshot != null ? round2(line.costPriceSnapshot) : round2(p.costPrice);
          st.inHand = qty3(st.inHand + q);
          if (st.inHand > 0) {
            st.avgCost = round2((round2((st.inHand - q) * st.avgCost) + round2(q * unitCost)) / st.inHand);
          }
          st.purchaseQty = qty3(st.purchaseQty + q);
          st.purchaseAmount = round2(st.purchaseAmount + q * unitCost);
          entry.purchaseAmount = round2(entry.purchaseAmount + q * unitCost);
          ms.purchaseQty = qty3(ms.purchaseQty + q);
          ms.purchaseAmount = round2(ms.purchaseAmount + q * unitCost);
        } else {
          st.inHand = qty3(st.inHand - q);
          if (doc.payKind === '积分') {
            var pc = round2(q * (line.costPriceSnapshot != null ? round2(line.costPriceSnapshot) : st.avgCost));
            st.pointsQty = qty3(st.pointsQty + q);
            st.pointsAmount = round2(st.pointsAmount + amount);
            st.pointsCost = round2(st.pointsCost + pc);
            mb.pointsCost = round2(mb.pointsCost + pc);
            entry.pointsAmount = round2(entry.pointsAmount + amount);
            entry.pointsCost = round2(entry.pointsCost + pc);
            ms.pointsQty = qty3(ms.pointsQty + q);
            ms.pointsAmount = round2(ms.pointsAmount + amount);
            ms.pointsCost = round2(ms.pointsCost + pc);
            totals.pointsQty = qty3(totals.pointsQty + q);
            totals.pointsAmount = round2(totals.pointsAmount + amount);
            totals.pointsCost = round2(totals.pointsCost + pc);
          } else {
            var sc = round2(q * st.avgCost);
            st.saleQty = qty3(st.saleQty + q);
            st.saleAmount = round2(st.saleAmount + amount);
            st.soldCost = round2(st.soldCost + sc);
            mb.soldCost = round2(mb.soldCost + sc);
            entry.saleAmount = round2(entry.saleAmount + amount);
            entry.soldCost = round2(entry.soldCost + sc);
            ms.saleQty = qty3(ms.saleQty + q);
            ms.saleAmount = round2(ms.saleAmount + amount);
            ms.soldCost = round2(ms.soldCost + sc);
            totals.saleQty = qty3(totals.saleQty + q);
            totals.saleAmount = round2(totals.saleAmount + amount);
            totals.soldCost = round2(totals.soldCost + sc);
          }
        }
      });

      if (!isIn) {
        entry.paidFromBalance = doc.payKind === '积分' ? 0 : round2(doc.paidFromBalance);
        entry.debt = doc.payKind === '积分' ? 0 : Math.max(0, round2(doc.debt));
        entry.pointsUsed = doc.payKind === '积分' ? Math.max(0, Math.round(num(doc.pointsUsed))) : 0;
        /* 应计口径：余额单收入 = 这一单的货值（欠着的也是卖出去的货），积分单收入 = 0 */
        entry.outAmount = doc.payKind === '积分' ? 0 : entry.amount;
        entry.revenue = entry.outAmount;
        ms.outAmount = round2(ms.outAmount + entry.outAmount);
        totals.outAmount = round2(totals.outAmount + entry.outAmount);
        ms.revenue = round2(ms.revenue + entry.revenue);
        ms.debtTotal = round2(ms.debtTotal + entry.debt);
        ms.pointsUsed += entry.pointsUsed;
        totals.revenue = round2(totals.revenue + entry.revenue);
        totals.debtTotal = round2(totals.debtTotal + entry.debt);
        totals.pointsUsed += entry.pointsUsed;
      } else {
        totals.purchaseQty = qty3(totals.purchaseQty + entry.qty);
        totals.purchaseAmount = round2(totals.purchaseAmount + entry.purchaseAmount);
      }

      totals.docCount += 1;
      ledger.push(entry);
      ms.ledger.push(entry);
    });

    Object.keys(byMonth).forEach(function (ym) {
      var m = byMonth[ym];
      m.grossProfit = round2(m.revenue - m.soldCost);
    });
    totals.grossProfit = round2(totals.revenue - totals.soldCost);

    return { byProduct: byProduct, byMonth: byMonth, ledger: ledger, totals: totals };
  }

  function costing(db) {
    var r = replay(db);
    return {
      byProduct: r.byProduct,
      byMonth: r.byMonth,
      revenue: r.totals.revenue,
      outAmount: r.totals.outAmount,
      pointsAmount: r.totals.pointsAmount,
      soldCost: r.totals.soldCost,
      pointsCost: r.totals.pointsCost,
      grossProfit: r.totals.grossProfit,
      totals: r.totals
    };
  }

  /** 积分单成本合计：按行 costPriceSnapshot × 数量（口径见 SPEC §5） */
  function pointsCost(db) {
    var total = 0;
    ((db && db.docs) || []).forEach(function (doc) {
      if (doc.docType !== '出货' || doc.payKind !== '积分') return;
      (doc.lines || []).forEach(function (line) {
        var snap = line.costPriceSnapshot == null ? 0 : num(line.costPriceSnapshot);
        total = round2(total + snap * num(line.qty));
      });
    });
    return total;
  }

  /* ============================ 10. 统计（表格式视图 / 仪表盘） ============================ */

  function tWindow(db, fromIn, toIn) {
    var to = isDateStr(toIn) ? toIn : todayStr();
    var from = isDateStr(fromIn) ? fromIn : addDays(to, -29);
    var rep = replay(db);
    var out = {
      from: from, to: to, docCount: 0, purchaseQty: 0, purchaseAmount: 0,
      saleQty: 0, saleAmount: 0, outAmount: 0, pointsQty: 0, pointsAmount: 0,
      revenue: 0, debtTotal: 0, soldCost: 0, pointsCost: 0, grossProfit: 0, grossMargin: null
    };
    rep.ledger.forEach(function (e) {
      if (!isDateStr(e.date) || e.date < from || e.date > to) return;
      out.docCount += 1;
      out.purchaseQty = qty3(out.purchaseQty + (e.docType === '进货' ? e.qty : 0));
      out.purchaseAmount = round2(out.purchaseAmount + e.purchaseAmount);
      out.saleQty = qty3(out.saleQty + (e.docType === '出货' && e.payKind === '余额' ? e.qty : 0));
      out.saleAmount = round2(out.saleAmount + e.saleAmount);
      out.outAmount = round2(out.outAmount + e.outAmount);
      out.pointsQty = qty3(out.pointsQty + (e.docType === '出货' && e.payKind === '积分' ? e.qty : 0));
      out.pointsAmount = round2(out.pointsAmount + e.pointsAmount);
      out.revenue = round2(out.revenue + e.revenue);
      out.debtTotal = round2(out.debtTotal + e.debt);
      out.soldCost = round2(out.soldCost + e.soldCost);
      out.pointsCost = round2(out.pointsCost + e.pointsCost);
    });
    out.grossProfit = round2(out.revenue - out.soldCost);
    out.grossMargin = out.revenue > 0.005 ? out.grossProfit / out.revenue : null;
    return out;
  }

  function tMonth(db, ymIn) {
    var months = {};
    ((db && db.docs) || []).forEach(function (d) {
      if (d.docType !== '盘点' && isDateStr(d.date)) months[d.date.slice(0, 7)] = true;
    });
    var keys = Object.keys(months).sort();
    var ym = typeof ymIn === 'string' && /^\d{4}-\d{2}$/.test(ymIn) ? ymIn : (keys.length ? keys[keys.length - 1] : ymOf(todayStr()));
    var rep = replay(db);
    var m = rep.byMonth[ym] || {
      docCount: 0, purchaseAmount: 0, purchaseQty: 0, saleAmount: 0, saleQty: 0, outAmount: 0,
      pointsAmount: 0, pointsQty: 0, revenue: 0, debtTotal: 0, soldCost: 0, pointsCost: 0, grossProfit: 0
    };
    return {
      ym: ym, docCount: m.docCount, months: keys,
      purchaseAmount: round2(m.purchaseAmount), purchaseQty: qty3(m.purchaseQty),
      saleAmount: round2(m.saleAmount), outAmount: round2(m.outAmount), saleQty: qty3(m.saleQty),
      pointsAmount: round2(m.pointsAmount), pointsQty: qty3(m.pointsQty),
      revenue: round2(m.revenue), debtTotal: round2(m.debtTotal),
      soldCost: round2(m.soldCost), pointsCost: round2(m.pointsCost),
      grossProfit: round2(m.grossProfit)
    };
  }

  /** 最近 days 天（含今天） */
  function tRecent(db, todayIn, days) {
    var t = isDateStr(todayIn) ? todayIn : todayStr();
    var n = num(days) > 0 ? Math.round(num(days)) : 30;
    return tWindow(db, addDays(t, -(n - 1)), t);
  }

  function alertThreshold(q30) {
    return Math.max(2, Math.ceil((num(q30) / 30) * 14));
  }

  function statusOf(inHand, threshold, q30) {
    var sold = num(q30);
    if (num(inHand) <= 0) return sold > 0 ? '紧缺' : '无货';
    if (num(inHand) <= num(threshold)) return '偏低';
    return '充足';
  }

  /** q30 = 近 30 天所有出货（余额单 + 积分单）数量合计 */
  function soldQtyWindow(db, today) {
    var t = isDateStr(today) ? today : todayStr();
    var from = addDays(t, -29);
    var q = {};
    ((db && db.docs) || []).forEach(function (doc) {
      if (doc.docType !== '出货' || !isDateStr(doc.date)) return;
      if (doc.date < from || doc.date > t) return;
      (doc.lines || []).forEach(function (line) {
        q[line.productId] = qty3((q[line.productId] || 0) + num(line.qty));
      });
    });
    return q;
  }

  function alerts(db, todayIn) {
    var t = isDateStr(todayIn) ? todayIn : todayStr();
    var inv = inventory(db);
    var q = soldQtyWindow(db, t);
    var out = ((db && db.products) || []).map(function (p) {
      var rec = inv[p.id] || { inHand: 0 };
      var q30 = qty3(q[p.id] || 0);
      var threshold = alertThreshold(q30);
      var status = statusOf(rec.inHand, threshold, q30);
      return {
        productId: p.id, name: p.name, unit: p.unit, category: p.category, sub: p.sub,
        inHand: rec.inHand, q30: q30, threshold: threshold,
        status: status, statusRank: STATUS_RANK[status], active: p.active !== false,
        costPrice: p.costPrice, storePrice: p.storePrice, retailPrice: p.retailPrice
      };
    });
    out.sort(function (a, b) {
      if (a.statusRank !== b.statusRank) return a.statusRank - b.statusRank;
      if (a.inHand !== b.inHand) return a.inHand - b.inHand;
      var an = String(a.name), bn = String(b.name);
      return an < bn ? -1 : an > bn ? 1 : 0;
    });
    return out;
  }

  /* ============================ 11. 欠款明细 ============================ */

  /** 出货未收明细：只认 debt > 0 的单（settled 口径已废弃） */
  function unpaidOuts(db, todayIn) {
    var today = isDateStr(todayIn) ? todayIn : todayStr();
    var pm = productMap(db), cm = customerMap(db);
    var rows = [];
    sortedDocs(db).forEach(function (doc) {
      if (doc.docType !== '出货' || doc.payKind === '积分') return;
      var debt = round2(doc.debt);
      if (!(debt > 0)) return;
      var totals = docTotals(db, doc);
      var parts = [], qty = 0;
      (doc.lines || []).forEach(function (l) {
        var p = pm[l.productId] || {};
        parts.push(String(p.name || '') + ' ' + fmtQty(l.qty) + (p.unit || ''));
        qty = qty3(qty + num(l.qty));
      });
      rows.push({
        docId: doc.id, no: doc.no, date: doc.date,
        partnerId: doc.partnerId || null,
        partnerName: doc.partnerName || (doc.partnerId && cm[doc.partnerId] ? cm[doc.partnerId].name : '') || '散客',
        productText: parts.join('、'), qty: qty, lineCount: totals.lineCount,
        docAmount: totals.amount, paidFromBalance: totals.paidFromBalance, debt: debt,
        amount: debt, age: ageDays(doc.date, today)
      });
    });
    rows.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return String(a.no) < String(b.no) ? -1 : 1;
    });
    var t = { count: rows.length, amount: 0, earliest: '', topCustomer: '', topAmount: 0, maxAge: 0, today: today };
    var cust = {};
    rows.forEach(function (r) {
      t.amount = round2(t.amount + r.amount);
      if (!t.earliest || r.date < t.earliest) t.earliest = r.date;
      if (r.age > t.maxAge) t.maxAge = r.age;
      cust[r.partnerName] = round2((cust[r.partnerName] || 0) + r.amount);
      if (cust[r.partnerName] > t.topAmount) {
        t.topAmount = cust[r.partnerName];
        t.topCustomer = r.partnerName;
      }
    });
    return {
      rows: rows, count: t.count, amount: t.amount, earliest: t.earliest,
      topCustomer: t.topCustomer, topAmount: t.topAmount, maxAge: t.maxAge, today: today
    };
  }

  /* ============================ 12. 清空 / 备份 / 合并 ============================ */

  /**
   * 全部清空，全新开始：单据、客户、三本台账、meta.edits 全删，产品 66 个原样保留。
   * 返回 removed 里给各表清掉的数量。
   */
  function clearBooks(db) {
    var next = clone(db) || emptyDb();
    var removed = {
      docs: ((next.docs) || []).length,
      customers: ((next.customers) || []).length,
      deposits: ((next.deposits) || []).length,
      receipts: ((next.receipts) || []).length,
      pointLogs: ((next.pointLogs) || []).length
    };
    next.docs = [];
    next.customers = [];
    next.deposits = [];
    next.receipts = [];
    next.pointLogs = [];
    next.meta = normMeta(next.meta);
    next.meta.edits = [];
    delete next.meta.lastEdit;
    return { db: next, removed: removed };
  }

  /** 记一笔改动：meta.edits 是最近 20 条（新的在前） */
  function logEdit(db, what, at) {
    var next = clone(db) || emptyDb();
    var stamp = typeof at === 'string' && at ? at : nowStamp();
    var txt = String(what == null ? '' : what).slice(0, 200);
    next.meta = normMeta(next.meta);
    next.meta.edits = [{ at: stamp, what: txt }].concat(next.meta.edits).slice(0, EDIT_LOG_MAX);
    return next;
  }

  function editLog(db, limit) {
    var n = limit > 0 ? limit : EDIT_LOG_MAX;
    return ((db && db.meta && db.meta.edits) || []).slice(0, n);
  }

  function touchBackup(db, dateStr) {
    var next = clone(db) || emptyDb();
    next.meta = normMeta(Object.assign({}, next.meta, {
      lastBackupAt: isDateStr(dateStr) ? dateStr : todayStr()
    }));
    return next;
  }

  function backupStatus(db, today) {
    var t = isDateStr(today) ? today : todayStr();
    var last = (db && db.meta && db.meta.lastBackupAt) || '';
    if (!isDateStr(last)) {
      return { level: 'never', days: null, last: '', text: '还没备份过：建议现在就去「设置/备份」导出一次 JSON（数据只存在这台浏览器里）' };
    }
    var d = dayDiff(last, t);
    if (!isFinite(d)) return { level: 'never', days: null, last: last, text: '还没备份过：建议现在就去「设置/备份」导出一次 JSON' };
    if (d < BACKUP_WARN_DAYS) return { level: 'ok', days: d, last: last, text: '上次备份：' + last };
    return { level: 'stale', days: d, last: last, text: '已经 ' + d + ' 天没备份了：建议现在导出一次 JSON' };
  }

  function pickNewer(a, b) {
    var ta = a && a.updatedAt, tb = b && b.updatedAt;
    if (ta != null && tb != null) {
      var na = typeof ta === 'number' ? ta : Date.parse(String(ta));
      var nb = typeof tb === 'number' ? tb : Date.parse(String(tb));
      if (isFinite(na) && isFinite(nb) && nb >= na) return b;
      if (isFinite(na) && isFinite(nb)) return a;
    }
    return b;
  }

  function mergeLists(base, incoming) {
    var out = (base || []).slice();
    (incoming || []).forEach(function (x) {
      if (!x) return;
      var idx = -1;
      for (var i = 0; i < out.length; i++) {
        if (out[i].id && x.id && out[i].id === x.id) { idx = i; break; }
      }
      if (idx >= 0) out[idx] = pickNewer(out[idx], x);
      else out.push(x);
    });
    return out;
  }

  /** mode: 'merge' 合并 | 'overwrite' 覆盖 */
  function mergeDb(base, incoming, mode) {
    var inc = parseDb(incoming);
    if (mode === 'overwrite') return inc;
    var out = clone(base) || emptyDb();
    out.products = mergeLists(out.products, inc.products);
    out.customers = mergeLists(out.customers, inc.customers);
    out.docs = mergeLists(out.docs, inc.docs);
    out.deposits = mergeLists(out.deposits, inc.deposits);
    out.receipts = mergeLists(out.receipts, inc.receipts);
    out.pointLogs = mergeLists(out.pointLogs, inc.pointLogs);

  function csvCell(v) {

  }
  function csvRow(arr) { return arr.map(csvCell).join(','); }

  function csvSection(title, header, rows) {

  function buildCsv(db, today) {

    lines = lines.concat(csvSection('收款销账', ['单号', '日期', '客户', '金额', '备注', '记录时间'],
      ((db && db.receipts) || []).map(function (x) {
        return [x.no, x.date, (cm[x.customerId] || {}).name || '', fmt(x.amount), x.note || '', x.at || ''];
      })));
    lines = lines.concat(csvSection('积分流水', ['单号', '日期', '客户', '增减', '原因', '记录时间'],
      ((db && db.pointLogs) || []).map(function (x) {
        return [x.no, x.date, (cm[x.customerId] || {}).name || '', x.delta, x.reason || '', x.at || ''];
      })));

    return { name: 'xh-jxc-' + t + '.csv', text: '\uFEFF' + lines.join('\r\n') };
  }

  return {

});

  /* ============================ 存储 / 状态 ============================ */
  var memRaw = null;
  var LS_OK = (function () {
    try {
      localStorage.setItem('__xh_probe', '1');
      localStorage.removeItem('__xh_probe');
      return true;
    } catch (e) { return false; }
  })();

  function rawLoad() {
    try { return LS_OK ? localStorage.getItem(C.STORAGE_KEY) : memRaw; } catch (e) { return memRaw; }
  }
  function rawSave(db) {
    var s = JSON.stringify(db);
    try {
      if (LS_OK) { localStorage.setItem(C.STORAGE_KEY, s); return; }
    } catch (e) { LS_OK = false; }
    memRaw = s;
  }
  function loadDb() {
    var raw = rawLoad();
    if (!raw) return C.emptyDb();
    try { return C.parseDb(raw); } catch (e) { return C.emptyDb(); }
  }

  var state = {
    db: null,
    page: 'dash',
    modal: null,
    f: {},
    newCust: false,
    newProduct: false,
    inDoc: null,
    outDoc: null,
    pointsCid: '',
    clearStep: 0,
    impStep: 0,
    removed: null,
    bannerHidden: false,
    theme: C.THEME_DEFAULT
  };

  function fget(k) { var v = state.f[k]; return v == null ? '' : String(v); }
  function fnum(k) { return C.num(state.f[k]); }

  /* ---------- 外观 ---------- */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function sysDark() { return !!(mq && mq.matches); }
  function loadTheme() {
    try { return C.normTheme(localStorage.getItem(C.THEME_KEY)); } catch (e) { return C.THEME_DEFAULT; }
  }
  function saveTheme() { try { localStorage.setItem(C.THEME_KEY, state.theme); } catch (e) {} }
  function applyTheme() { document.documentElement.setAttribute('data-theme', C.resolveTheme(state.theme, sysDark())); }

  /* ---------- 小工具 ---------- */
  function esc(s) { return C.hEsc(s); }
  function money(v) { return C.fmt(v); }
  function qtyS(v) { return C.fmtQty(v); }
  function today() { return C.todayStr(); }
  function pageInfo(id) {
    for (var i = 0; i < PAGES.length; i++) if (PAGES[i].id === id) return PAGES[i];
    return { id: SET, label: '设置', short: '设置' };
  }

  var toastTimer = null;
  function toast(msg, isErr) {
    var el = document.getElementById('toast');
    if (!el) return;
    el.textContent = String(msg == null ? '' : msg);
    el.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, isErr ? 4200 : 2400);
  }

  function commit(db, what) {
    state.db = what ? C.logEdit(db, what) : db;
    rawSave(state.db);
  }

  function download(name, text, mime) {
    try {
      var blob = new Blob([text], { type: mime || 'application/json;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () {
        URL.revokeObjectURL(url);
        if (a.parentNode) a.parentNode.removeChild(a);
      }, 600);
    } catch (e) { toast('这个浏览器不允许下载文件：' + e.message, true); }
  }

  /* ============================ 焦点保持 ============================ */
  function sigOf(el) {
    if (!el || !el.dataset) return '';
    var d = el.dataset;
    return [el.tagName, d.act || '', d.k || '', d.li || '', d.lf || '', d.id || ''].join('|');
  }
  function captureFocus() {
    var el = document.activeElement;
    if (!el || el === document.body || !app.contains(el)) return null;
    var sig = sigOf(el);
    if (!sig) return null;
    var all = app.querySelectorAll('input,select,textarea,button');
    var idx = 0, seen = 0, i;
    for (i = 0; i < all.length; i++) {
      if (sigOf(all[i]) !== sig) continue;
      if (all[i] === el) { idx = seen; break; }
      seen++;
    }
    var caret = null;
    try { caret = el.selectionStart; } catch (e) { caret = null; }
    return { sig: sig, idx: idx, caret: caret };
  }
  function restoreFocus(f) {
    if (!f) return;
    var all = app.querySelectorAll('input,select,textarea,button');
    var seen = 0, i;
    for (i = 0; i < all.length; i++) {
      if (sigOf(all[i]) !== f.sig) continue;
      if (seen === f.idx) {
        try {
          all[i].focus({ preventScroll: true });
          if (f.caret != null) all[i].setSelectionRange(f.caret, f.caret);
        } catch (e) {}
        return;
      }
      seen++;
    }
  }

  function render(opts) {
    opts = opts || {};
    var f = opts.top ? null : captureFocus();
    var y = window.scrollY || 0;
    app.innerHTML = state.page === SET ? viewSettings() : viewShell();
    document.body.classList.toggle('sheet-open', !!state.modal);
    if (opts.top) {
      window.scrollTo(0, 0);
    } else {
      restoreFocus(f);
      window.scrollTo(0, y);
    }
    if (opts.focusModal && state.modal) {
      var first = app.querySelector('.sheet-panel input, .sheet-panel select');
      if (first) { try { first.focus({ preventScroll: true }); } catch (e) {} }
    }
  }

  /* ============================ 通用片段 ============================ */
  function appbar() {
    if (state.page === SET) {
      return '<header class="appbar"><div class="appbar-in">' +
        '<button class="iconbtn" data-act="backSet" aria-label="返回">' + icon('back', 22) + '</button>' +
        '<h1>设置</h1><span class="appbar-sp"></span></div></header>';
    }
    var p = pageInfo(state.page);
    return '<header class="appbar"><div class="appbar-in">' +
      '<h1>' + esc(p.label) + '</h1>' +
      '<button class="iconbtn" data-act="set" aria-label="设置" title="设置">' + icon('settings', 21) + '</button>' +
      '</div></header>';
  }

  function bannerHTML() {
    if (state.page === SET || state.bannerHidden) return '';
    var b = C.backupStatus(state.db, today());
    if (b.level === 'ok') return '';
    return '<div class="banner"><span class="banner-ic">' + icon('alert', 18) + '</span>' +
      '<div class="banner-tx">' + esc(b.text) + '</div>' +
      '<button class="banner-go" data-act="set">去备份</button>' +
      '<button class="banner-x" data-act="closeBanner" aria-label="关闭">' + icon('close', 16) + '</button></div>';

  function navHTML() {
    var out = '<nav class="tabbar">';

      var on = state.page === p.id;
      out += '<button class="tab' + (on ? ' on' : '') + '" data-act="nav" data-v="' + p.id + '"' +
        (on ? ' aria-current="page"' : '') + '>' +
        '<span class="ti">' + icon(p.icon, 21) + '</span>' +
        '<span class="tl">' + esc(p.label) + '</span>' +
        '<span class="ts">' + esc(p.short) + '</span></button>';
    });
    return out + '</nav>';
  }

  function dockHTML() {
    var d = {
      cust: { act: 'newCust', label: '＋ 新建客户' },
      price: { act: 'newProduct', label: '＋ 新建产品' },
      'in': { act: 'openIn', label: '＋ 进货' },
      out: { act: 'openOut', label: '＋ 出货' }
    }[state.page];
    if (!d) return '';
    return '<div class="dock"><button class="btn primary" data-act="' + d.act + '">' + d.label + '</button></div>';
  }

  function sec(title, note) {
    return '<div class="sec-hd"><h2>' + esc(title) + '</h2>' +

  function searchBar(k, ph) {
    return '<div class="searchbar"><span class="search-ico">' + icon('search', 18) + '</span>' +

  }

  /* ============================ 页面：仪表盘 ============================ */
  function viewDash() {
    var db = state.db, t = today();
    var invT = C.inventoryTotals(C.inventory(db));
    var accs = C.allAccounts(db, t);
    var bal = 0, debt = 0;
    accs.forEach(function (a) { bal = C.round2(bal + a.balance); debt = C.round2(debt + a.debt); });
    var w = C.tRecent(db, t, 30);
    var pcost = C.pointsCost(db);

    var h = '<section class="grid kpis">' +
      kpi('库存合计', qtyS(invT.inHand), '件', '') +
      kpi('客户余额合计', money(bal), '元', 'pos') +
      kpi('欠款合计', money(debt), '元', debt > 0 ? 'danger' : '') +
      kpi('近30天进货', money(w.purchaseAmount), '元', '') +
      kpi('近30天出货', money(w.outAmount), '元', '') +
      kpi('近30天毛利', money(w.grossProfit), '元', w.grossProfit < 0 ? 'danger' : 'pos') +
      kpi('积分送出成本', money(pcost), '元', '') +
      '</section>';

    var tips = [];
    if (!(db.customers || []).length) tips.push('还没有客户，先去客户页加一个');
    if (!(db.products || []).length) tips.push('还没有产品，先去「价格」页建一个');
    if (!(db.docs || []).length) tips.push('还没有单据：从「进货」或「出货」开第一单');
    if (tips.length) {
      h += sec('从这里开始');
      h += '<div class="card guide">' + tips.map(function (x) { return '<p>' + esc(x) + '</p>'; }).join('') +
        '<div class="card-ft"><button class="btn ghost" data-act="nav" data-v="cust">去客户页</button>' +
        '<button class="btn ghost" data-act="nav" data-v="price">去价格页</button></div></div>';
    }

    var debtors = accs.filter(function (a) { return a.debt > 0; })
      .sort(function (a, b) { return b.debt - a.debt; }).slice(0, 5);
    h += '<div class="dash-cols"><div class="dcol">';
    h += sec('欠款最多的 5 个客户');
    h += debtors.length ? '<div class="card list">' + debtors.map(function (a) {
      return '<button class="row" data-act="goCust" data-id="' + esc(a.customerId) + '">' +
        '<span class="row-main"><b>' + esc(a.name) + '</b><small>余额 ' + money(a.balance) + ' · 积分 ' + a.points + '</small></span>' +
        '<span class="row-val danger">' + money(a.debt) + '</span></button>';
    }).join('') + '</div>' : emptyState('还没有欠款：客户欠钱会在出货单上自动记下来。');

    var alerts = C.alerts(db, t).filter(function (a) { return a.active && a.status !== '充足'; }).slice(0, 5);
    h += '</div><div class="dcol">';
    h += sec('该补货的 5 个产品');
    h += alerts.length ? '<div class="card list">' + alerts.map(function (a) {
      return '<button class="row" data-act="goStock" data-id="' + esc(a.productId) + '">' +
        '<span class="row-main"><b>' + esc(a.name) + '</b><small>近30天出货 ' + qtyS(a.q30) + a.unit + ' · 阈值 ' + qtyS(a.threshold) + '</small></span>' +
        '<span class="row-val"><span class="stat-chip s-' + esc(a.status) + '">' + esc(a.status) + '</span> ' + qtyS(a.inHand) + '</span></button>';
    }).join('') + '</div>' : emptyState('暂时没有要补的产品：库存都还够。');
    h += '</div></div>';
    return h;
  }

  function kpi(label, value, unit, cls) {
    return '<div class="kpi"><div class="kpi-l">' + esc(label) + '</div>' +
      '<div class="kpi-v ' + (cls || '') + '">' + esc(value) + '<small>' + esc(unit) + '</small></div></div>';
  }

  /* ============================ 页面：库存 ============================ */
  function viewStock() {
    var db = state.db, t = today();
    var rows = C.alerts(db, t);
    var q = fget('stockQ').trim().toLowerCase();
    var list = rows.filter(function (a) {
      if (q && (String(a.name) + ' ' + a.category + ' ' + a.sub + ' ' + a.unit).toLowerCase().indexOf(q) < 0) return false;
      if (state.f.stockLow === '1' && a.status === '充足') return false;
      return true;
    });
    var totalQty = 0, low = 0;
    rows.forEach(function (a) { totalQty = C.qty3(totalQty + a.inHand); if (a.status !== '充足') low += 1; });

    var h = '<section class="strip">' +
      '<div><small>在手合计</small><b>' + qtyS(totalQty) + '</b></div>' +
      '<div><small>要补的品</small><b>' + low + '</b></div>' +
      '<div><small>产品数</small><b>' + rows.length + '</b></div></section>';
    h += searchBar('stockQ', '搜产品名 / 类目');
    h += '<div class="chips-row"><button class="chip' + (state.f.stockLow === '1' ? ' on' : '') + '" data-act="toggleLow">只看要补货</button></div>';

    var tail = countLogHTML();

    h += '<section class="grid">' + list.map(function (a) {
      return '<article class="card stock" data-id="' + esc(a.productId) + '">' +

        '<button class="stock-num" data-act="stockCount" data-id="' + esc(a.productId) + '" aria-label="改当前库存">' +
        '<b>' + qtyS(a.inHand) + '</b><small>' + esc(a.unit) + '</small></button>' +
        '</article>';
    }).join('') + '</section>';
    return h + tail;
  }

  function countLogHTML() {
    var pm = C.productMap(state.db);
    var rows = (state.db.docs || []).filter(function (d) { return d.docType === '盘点'; })
      .sort(function (a, b) {
        if (a.date !== b.date) return a.date < b.date ? 1 : -1;
        return String(a.no) < String(b.no) ? 1 : -1;
      }).slice(0, 10);
    var h = sec('最近盘点', '最多 10 条');
    if (!rows.length) return h + emptyState('还没有盘点记录');
    h += '<div class="card list">' + rows.map(function (d) {
      var line = d.lines && d.lines[0] ? d.lines[0] : null;
      var p = line ? pm[line.productId] : null;
      var diff = line ? C.qty3(line.qty) : 0;
      var what = p ? esc(p.name) + ' ' + (diff > 0 ? '+' : '') + qtyS(diff) + esc(p.unit || '') : '（产品已删）';
      if (d.lines && d.lines.length > 1) what += ' 等 ' + d.lines.length + ' 行';
      return '<div class="row count-row">' +
        '<span class="row-main"><b>' + what + '</b><small>' + esc(d.date) + ' · ' + esc(d.no) +

        '<button class="iconbtn sm" data-act="delCount" data-id="' + esc(d.id) + '" aria-label="删除这张盘点单">' +
        icon('close', 16) + '</button></div>';
    }).join('') + '</div>';
    return h;
  }

  /* ============================ 页面：客户 ============================ */
  function viewCust() {
    var db = state.db, t = today();
    var accs = C.allAccounts(db, t);
    var q = fget('custQ').trim().toLowerCase();
    var cards = (db.customers || []).map(function (c, i) {
      var a = accs[i] || C.customerAccount(db, c.id, t);
      return { c: c, a: a, active: c.active !== false };
    }).filter(function (x) {
      if (!q) return true;
      return (String(x.c.name) + ' ' + (x.c.note || '')).toLowerCase().indexOf(q) >= 0;
    });
    cards.sort(function (x, y) { return (y.active ? 1 : 0) - (x.active ? 1 : 0); });

    var h = '';
    if (state.newCust) h += newCustCard();
    h += searchBar('custQ', '搜客户名 / 备注');
    if (!cards.length) return h + emptyState((db.customers || []).length ? '没有匹配的客户' : '还没有客户：点下面「＋ 新建客户」');
    h += '<section class="grid">' + cards.map(function (x) {
      var c = x.c, a = x.a;
      return '<article class="card cust' + (x.active ? '' : ' off') + '">' +
        '<div class="card-hd"><div class="card-main"><div class="card-ttl">' + esc(c.name) + '</div>' +
        '<div class="card-sub">' + (a.lastDate ? '最近 ' + esc(a.lastDate) : '还没有往来') + '</div></div>' +
        '<button class="chip' + (x.active ? ' on' : '') + '" data-act="toggleCust" data-id="' + esc(c.id) + '">' +
        (x.active ? '正常' : '停用') + '</button></div>' +
        '<div class="tri">' +
        '<div class="tri-i"><small>余额</small><b class="pos">' + money(a.balance) + '</b></div>' +
        '<div class="tri-i"><small>积分</small><b>' + a.points + '</b></div>' +
        '<div class="tri-i"><small>欠款</small><b class="' + (a.debt > 0 ? 'danger' : '') + '">' + money(a.debt) + '</b></div>' +
        '</div>' +
        '<label class="note-edit"><span>备注</span><input data-act="custNote" data-id="' + esc(c.id) + '" value="' + esc(c.note || '') + '" placeholder="点这里写备注"></label>' +
        '<div class="card-ft"><button class="btn ghost" data-act="deposit" data-id="' + esc(c.id) + '">充值</button>' +
        '<button class="btn ghost" data-act="receipt" data-id="' + esc(c.id) + '">收款</button>' +

      '<button class="iconbtn sm" data-act="cancelNewCust" aria-label="取消">' + icon('close', 18) + '</button></div>' +

  /* ============================ 页面：进货 ============================ */
  function viewIn() {
    var db = state.db, pm = C.productMap(db);
    var docs = C.sortedDocs(db).filter(function (d) { return d.docType === '进货'; }).reverse();
    var amount = 0;
    docs.forEach(function (d) { amount = C.round2(amount + C.docTotals(db, d).amount); });
    var h = '<section class="strip"><div><small>进货单</small><b>' + docs.length + '</b></div>' +
      '<div><small>进货金额</small><b>' + money(amount) + '</b></div></section>';

    h += '<section class="grid">' + docs.map(function (d) {
      var t = C.docTotals(db, d);
      return '<article class="card doc">' +
        '<div class="card-hd"><div class="card-main"><div class="card-ttl">' + esc(d.no) + '</div>' +
        '<div class="card-sub">' + esc(d.date) + ' · ' + esc(d.partnerName || '总部') + '</div></div>' +
        '<div class="amt">' + money(t.amount) + '</div></div>' +
        '<ul class="lines">' + (d.lines || []).map(function (l) {
          var p = pm[l.productId] || {};
          return '<li><span>' + esc(p.name || l.productId) + '</span><span>' + qtyS(l.qty) + ' ' + esc(p.unit || '') +

        }).join('') + '</ul>' +
        (d.note ? '<div class="note">备注：' + esc(d.note) + '</div>' : '') +

  /* ============================ 页面：出货 ============================ */
  function viewOut() {
    var db = state.db, pm = C.productMap(db);
    var docs = C.sortedDocs(db).filter(function (d) { return d.docType === '出货'; }).reverse();
    var h = '<section class="strip"><div><small>出货单</small><b>' + docs.length + '</b></div>' +
