<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>雯迹</title>
<style>
:root {
  --bg:        #FFF5F6;
  --surface:   #FFFFFF;
  --rule:      #E5E5E5;
  --rule-strong: #CCCCCC;
  --text:      #1A1A1A;
  --text-2:    #555555;
  --text-3:    #888888;
  --pink:      #FFB7C5;
  --pink-dk:   #D9899A;
  --pink-lt:   #FFF0F3;
  --green:     #1AA821;
  --green-lt:  #E8F8E9;
  --red:       #CC0000;
  --red-lt:    #F8E8E8;
  --amber:     #B8860B;
  --amber-lt:  #FCF5E8;
  --font:      -apple-system,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --lh:        1.5;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:var(--lh);height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100%;max-width:500px;margin:0 auto;background:var(--bg);position:relative;border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.hd{background:var(--surface);padding:16px 20px 14px;border-bottom:1px solid var(--rule);display:flex;justify-content:space-between;align-items:flex-end;z-index:10}
.hd h1{font-family:'STXingkai','华文行楷','KaiTi','楷体',cursive;font-size:26px;font-weight:400;color:var(--text);letter-spacing:2px}
.hd .hd-meta{display:flex;align-items:center;gap:10px}
.hd .hd-info{font-size:11px;color:var(--text-3);font-weight:500}
.hd .gear{font-size:18px;cursor:pointer;color:var(--text-3);padding:4px;transition:color .2s}
.hd .gear:hover{color:var(--text)}
.nav{display:flex;background:var(--surface);border-bottom:1px solid var(--rule);padding:0;z-index:10}
.nav button{flex:1;padding:12px 2px 10px;font-size:11px;font-weight:500;color:var(--text-3);border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:all .2s;position:relative;letter-spacing:0.2px}
.nav button .ni{font-size:18px;transition:transform .2s}
.nav button.on{color:var(--green);font-weight:600}
.nav button.on::after{content:"";position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:20px;height:2px;background:var(--green)}
.nav button.on .ni{transform:translateY(-1px)}
.pgs{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:16px 18px 24px}
.pg{display:none}.pg.on{display:block}
.sec-title{font-size:10px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:1.5px;margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--rule)}
.sec-title:first-child{margin-top:0}
.card{background:var(--surface);padding:16px;margin-bottom:1px;border:1px solid var(--rule);position:relative}
.ban{background:var(--green);padding:20px 20px 18px;margin-bottom:0;color:#FFF;display:flex;justify-content:space-around;text-align:center}
.ban .bn-item{display:flex;flex-direction:column;align-items:center}
.ban .bn-v{font-size:36px;font-weight:800;letter-spacing:-1px;line-height:1;font-variant-numeric:tabular-nums;color:#FFF}
.ban .bn-t{font-size:10px;opacity:.8;margin-top:4px;letter-spacing:0.5px;text-transform:uppercase;font-weight:500;color:#FFF}
.sts-bar{display:flex;margin-bottom:1px}
.sts-it{flex:1;text-align:center;padding:14px 4px;background:var(--surface);border:1px solid var(--rule);border-right:none}
.sts-it:last-child{border-right:1px solid var(--rule)}
.sts-it .n{font-size:22px;font-weight:700;display:block;font-variant-numeric:tabular-nums;color:var(--text)}
.sts-it .lb{font-size:9px;color:var(--text-3);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}
.alert-row{display:flex;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--rule);margin-bottom:1px;cursor:pointer;transition:background .15s;font-size:13px;gap:10px}
.alert-row:hover{background:var(--pink-lt)}
.alert-row .ar-icon{width:28px;height:28px;border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--bg)}
.alert-row .ar-info{flex:1;min-width:0;font-weight:600;font-size:12px}
.alert-row .ar-meta{font-size:10px;color:var(--text-3);font-weight:400;margin-top:1px}
.alert-row .ar-action{font-size:10px;font-weight:700;flex-shrink:0;color:var(--green)}
.sr{display:flex;align-items:center;padding:14px;background:var(--surface);border:1px solid var(--rule);margin-bottom:1px;cursor:pointer;gap:12px;transition:background .15s}
.sr:hover{background:var(--pink-lt)}
.sr .ti{width:32px;height:32px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#FFF;flex-shrink:0;letter-spacing:-0.2px}
.ti-a{background:var(--green)}.ti-b{background:#555}.ti-c{background:var(--text-3)}
.sr .im{flex:1;min-width:0}.sr .nm{font-size:14px;font-weight:600;letter-spacing:-0.1px}
.sr .ad{font-size:10px;color:var(--text-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px}
.sr .mt{font-size:9px;color:var(--text-3);margin-top:1px}
.sr-acts{display:flex;gap:6px;flex-shrink:0}
.sr-acts button{padding:6px 12px;font-size:10px;font-weight:600;border:1px solid var(--rule);cursor:pointer;background:var(--surface);color:var(--text);transition:all .15s;letter-spacing:0.1px}
.sr-acts button:hover{border-color:var(--green);color:var(--green)}
.badge{display:inline-block;padding:2px 8px;font-size:9px;font-weight:700;letter-spacing:0.3px;text-transform:uppercase}
.badge-a{background:var(--green);color:#FFF}.badge-b{background:var(--rule-strong);color:var(--text)}.badge-c{background:var(--bg);color:var(--text-3)}
.badge-ok{background:var(--green-lt);color:var(--green)}.badge-warn{background:var(--amber-lt);color:var(--amber)}.badge-ov{background:var(--red-lt);color:var(--red)}
.oc{position:relative;background:var(--surface);border:1px solid var(--rule);padding:14px;margin-bottom:1px;cursor:pointer;transition:background .15s}
.oc:hover{background:var(--pink-lt)}
.oc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.oc-store{font-size:13px;font-weight:600}.oc-date{font-size:10px;color:var(--text-3)}
.oc-summary{font-size:10px;color:var(--text-2);border-top:1px solid var(--rule);padding-top:6px;margin-top:4px}
.dt-tabs{display:flex;border-bottom:1px solid var(--rule);margin-bottom:14px}
.dt-tabs button{flex:1;padding:10px 4px;border:none;background:none;font-size:11px;cursor:pointer;color:var(--text-3);font-weight:500;transition:all .2s;position:relative}
.dt-tabs button.on{color:var(--green);font-weight:600}
.dt-tabs button.on::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:2px;background:var(--green)}
.tb1{width:100%;border-collapse:collapse;font-size:11px}
.tb1 th{text-align:left;padding:8px 6px;border-bottom:2px solid var(--rule-strong);font-weight:700;font-size:9px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-3)}
.tb1 td{padding:7px 6px;border-bottom:1px solid var(--rule);vertical-align:top}
.tb1 td.n{text-align:right;font-variant-numeric:tabular-nums}.tb1 tr:last-child td{border-bottom:none}
.search-box{position:relative;margin-bottom:1px}
.search-box input{width:100%;padding:11px 12px 11px 34px;border:1px solid var(--rule);font-size:13px;background:var(--surface);color:var(--text);font-family:var(--font)}
.search-box input:focus{outline:none;border-color:var(--green)}
.search-box .s-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--text-3)}
.btn{display:inline-block;padding:10px 20px;background:var(--pink-dk);color:#4A2C2C;border:none;font-size:12px;font-weight:600;cursor:pointer;transition:opacity .15s;letter-spacing:0.1px}
.btn:hover{opacity:.88}.btn:active{opacity:.75}
.btn2{padding:9px 16px;background:var(--surface);color:var(--text);border:1px solid var(--rule);font-size:12px;cursor:pointer;font-weight:500;transition:all .15s}
.btn2:hover{border-color:var(--green);color:var(--green)}
.btn3{padding:6px 10px;background:var(--red-lt);color:var(--red);border:none;font-size:10px;cursor:pointer;font-weight:600;transition:opacity .15s}
.btn3:hover{opacity:.8}.btn-block{display:block;width:100%}.btn-sm{padding:5px 12px;font-size:10px}.btn-big{padding:14px 28px;font-size:16px}
.del-btn{width:22px;height:22px;border:1px solid var(--rule);background:var(--surface);color:var(--text-3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;line-height:1;padding:0;margin-left:4px}
.del-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-lt)}
.del-btn-oc{position:absolute;top:8px;right:8px;width:22px;height:22px;border:1px solid var(--rule);background:var(--surface);color:var(--text-3);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;line-height:1;padding:0;z-index:5}
.del-btn-oc:hover{border-color:var(--red);color:var(--red);background:var(--red-lt)}
.fg{margin-bottom:12px}.fg label{display:block;font-size:9px;font-weight:700;color:var(--text-3);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.8px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1px solid var(--rule);font-size:13px;background:var(--surface);font-family:var(--font);color:var(--text);transition:border-color .15s}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--green)}
.fg textarea{resize:vertical;min-height:50px}.fr{display:flex;gap:8px}.fr .fg{flex:1}
.fg .hlp{font-size:9px;color:var(--text-3);margin-top:2px}
.fs-div{display:flex;align-items:center;gap:10px;margin:14px 0 10px}
.fs-div .fs-line{flex:1;height:1px;background:var(--rule)}
.fs-div .fs-label{font-size:9px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:1px}
.seg{display:flex;border:1px solid var(--rule);margin-bottom:10px}
.seg button{flex:1;padding:8px 4px;border:none;background:var(--surface);font-size:10px;cursor:pointer;color:var(--text-3);font-weight:500;transition:all .15s;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--green);color:#FFF;font-weight:600}
.flt{display:flex;gap:1px;margin-bottom:1px}
.flt button{padding:7px 14px;background:var(--surface);border:1px solid var(--rule);font-size:10px;cursor:pointer;font-weight:500;color:var(--text-2);transition:all .15s;flex:1}
.flt button.on{background:var(--green);color:#FFF;font-weight:600;border-color:var(--green)}
.mo{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:100;align-items:flex-end;justify-content:center}
.mo.on{display:flex}
.md{background:var(--surface);width:100%;max-width:500px;max-height:90vh;overflow-y:auto;padding:20px 18px 24px;-webkit-overflow-scrolling:touch;border-top:1px solid var(--rule)}
.md h2{font-size:17px;font-weight:700;margin-bottom:16px;letter-spacing:-0.2px}
.md::before{content:"";display:block;width:32px;height:3px;background:var(--rule-strong);margin:0 auto 16px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#FFF;padding:10px 22px;font-size:12px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;font-weight:600;letter-spacing:0.2px}
.toast.on{opacity:1}
.ci-toast{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;z-index:300;pointer-events:none;opacity:0;transition:opacity .4s}
.ci-toast.on{opacity:1}
.ci-toast .ci-box{background:var(--green);color:#FFF;padding:22px 36px;text-align:center;font-size:15px;font-weight:600;letter-spacing:-0.1px}
.ci-toast .ci-box .ci-icon{font-size:36px;display:block;margin-bottom:6px}
.emp{text-align:center;padding:28px 16px;background:var(--surface);border:1px solid var(--rule)}
.emp .ic{font-size:28px;margin-bottom:8px}.emp p{font-size:12px;color:var(--text-3);margin-bottom:10px}
.prog-bar{height:6px;background:var(--bg);overflow:hidden}
.prog-bar .prog-fill{height:100%;background:linear-gradient(90deg,#FFB7C5,#FF9EB5);transition:width .3s}
.stat-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.stat-row:last-child{border-bottom:none}
.stat-row .stat-key{width:72px;font-size:11px;font-weight:600;flex-shrink:0}
.stat-row .stat-bar{flex:1;height:6px;background:var(--bg);margin:0 10px;overflow:hidden}
.stat-row .stat-bar .stat-fill{height:100%;background:linear-gradient(90deg,#FFB7C5,#FF9EB5)}
.stat-row .stat-val{font-size:11px;font-weight:600;flex-shrink:0;min-width:60px;text-align:right;font-variant-numeric:tabular-nums}
.stat-row .stat-sub{font-size:9px;color:var(--text-3);font-weight:400}
.store-detail-table{width:100%;border-collapse:collapse;font-size:11px}
.store-detail-table td{padding:6px 8px;border-bottom:1px solid var(--rule)}
.store-detail-table td:first-child{color:var(--text-3);font-size:10px;width:30%}
.store-detail-table tr:last-child td{border-bottom:none}
.ar-indicator{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:12px}
.ar-indicator .ar-value{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pgs::-webkit-scrollbar{width:3px}.pgs::-webkit-scrollbar-track{background:transparent}
.pgs::-webkit-scrollbar-thumb{background:var(--rule-strong)}
</style>
</head>
<body>
<div id="app">
  <div class="hd"><h1>雯迹</h1><div class="hd-meta"><span class="hd-info" id="hdInfo"></span><span class="gear" onclick="showSettings()">⚙</span></div></div>
  <div class="nav">
    <button class="on" onclick="switchTab('overview')"><span class="ni">◉</span>概览</button>
    <button onclick="switchTab('stores')"><span class="ni">▣</span>门店</button>
    <button onclick="switchTab('orders')"><span class="ni">▥</span>进货</button>
    <button onclick="switchTab('stats')"><span class="ni">◫</span>统计</button>
  </div>
  <div class="pgs">
    <div class="pg on" id="pg-overview"><div id="ovContent"></div></div>
    <div class="pg" id="pg-stores"><div id="storeFilter"></div><div id="storeSearch"></div><div id="storeList"></div><div style="text-align:center;margin-top:12px"><button class="btn btn-sm" id="fabBtn" style="display:none" onclick="showStoreForm(0)">+ 添加门店</button></div></div>
    <div class="pg" id="pg-orders"><div id="orderContent"></div></div>
    <div class="pg" id="pg-stats"><div id="statsContent"></div></div>
  </div>
</div>
<div class="mo" id="modal"><div class="md" id="modalContent"></div></div>
<div class="toast" id="toast"></div>
<div class="ci-toast" id="ciToast"><div class="ci-box"><span class="ci-icon">✓</span><span id="ciToastMsg"></span></div></div>
<script>
'use strict';
var el=function(id){return document.getElementById(id)};
function esc(s){if(!s)return'';var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function now(){return new Date().toISOString().slice(0,10)}
function today(){return now()}
function uid(){return'x'+Date.now()+'_'+Math.random().toString(36).slice(2,8)}
function fmt(d){if(!d)return'';var p=d.split('-');return p[1]+'/'+p[2]}
function fmtDT(d){if(!d)return'';var p=d.split('-');return p[0].slice(2)+'/'+p[1]+'/'+p[2]}
function fm(n){if(!n&&n!==0)return'0';return '¥'+Number(n).toLocaleString('zh-CN',{minimumFractionDigits:0,maximumFractionDigits:0})}
function pf(v){var n=parseFloat(v);return isNaN(n)?0:n}
function daysAgo(dt){var d=new Date(dt);var t=new Date();return Math.floor((t-d)/(86400000))}
function toast(msg){var t=el('toast');t.textContent=msg;t.classList.add('on');setTimeout(function(){t.classList.remove('on')},1800)}
function showModal(h){el('modalContent').innerHTML=h;el('modal').classList.add('on')}

function openDB(cb){var req=indexedDB.open(DB_NAME,DB_VER);req.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains('s'))d.createObjectStore('s',{keyPath:'id'});if(!d.objectStoreNames.contains('c')){var cs=d.createObjectStore('c',{keyPath:'id'});cs.createIndex('si','si',{unique:false})}if(!d.objectStoreNames.contains('o')){var os=d.createObjectStore('o',{keyPath:'id'});os.createIndex('si','si',{unique:false})}if(!d.objectStoreNames.contains('k'))d.createObjectStore('k',{keyPath:'k'})};req.onsuccess=function(e){db=e.target.result;if(cb)cb()};req.onerror=function(e){console.error(e);if(cb)cb(e)}}
function dbPut(store,data,cb){var tx=db.transaction(store,'readwrite'),os=tx.objectStore(store),r=os.put(data);r.onsuccess=function(){if(cb)cb()};r.onerror=function(e){console.error(e);if(cb)cb(e)}}
function dbGetAll(store,cb){var tx=db.transaction(store,'readonly'),os=tx.objectStore(store),r=os.getAll();r.onsuccess=function(){if(cb)cb(r.result)};r.onerror=function(){if(cb)cb([])}}
function dbDelete(store,id,cb){var tx=db.transaction(store,'readwrite'),os=tx.objectStore(store),r=os.delete(id);r.onsuccess=function(){if(cb)cb()};r.onerror=function(e){if(cb)cb(e)}}
function dbGet(store,id,cb){var tx=db.transaction(store,'readonly'),os=tx.objectStore(store),r=os.get(id);r.onsuccess=function(){if(cb)cb(r.result)};r.onerror=function(){if(cb)cb(null)}}
function dbGetByIdx(store,idx,val,cb){var tx=db.transaction(store,'readonly'),os=tx.objectStore(store),i=os.index(idx),r=i.getAll(val);r.onsuccess=function(){if(cb)cb(r.result)};r.onerror=function(){if(cb)cb([])}}
function getKV(k,cb){dbGet('k',k,function(v){if(cb)cb(v?v.v:'')})}

function renderStoreList(){el('fabBtn').style.display='none';var ss=allStores;if(curStoreFilter!=='all'&&curStoreFilter!=='overdue')ss=ss.filter(function(s){return s.tier===curStoreFilter});if(curStoreFilter==='overdue')ss=ss.filter(function(s){var lv=getLastCheckin(s.id);var days=lv?daysAgo(lv):999;return days>(s.cy||30)*SETTINGS.churnMult});if(storeSearchTerm){var term=storeSearchTerm.toLowerCase();ss=ss.filter(function(s){return(s.n||'').toLowerCase().indexOf(term)>=0||(s.a||'').toLowerCase().indexOf(term)>=0||(s.cn||'').toLowerCase().indexOf(term)>=0})}if(ss.length===0){el('storeList').innerHTML='<div class="emp"><div class="ic">▣</div><p>'+(storeSearchTerm?'无匹配门店':'暂无门店')+'</p><button class="btn btn-sm" onclick="showStoreForm(0)">添加门店</button></div>';return}var html='';for(var i=0;i<ss.length;i++){var s=ss[i],lv=getLastCheckin(s.id),days=lv?daysAgo(lv):999,cy=s.cy||30;var tierCls=s.tier==='A'?'ti-a':s.tier==='B'?'ti-b':'ti-c';var badgeCls='badge-'+(s.tier==='A'?'a':s.tier==='B'?'b':'c');html+='<div class="sr" onclick="showStoreDetail(\''+s.id+'\')"><div class="ti '+tierCls+'">'+s.tier+'</div><div class="im"><div class="nm">'+esc(s.n)+' <span class="badge '+badgeCls+'">'+(s.tier==='A'?'加盟店':s.tier==='B'?'牵手店':'拓展店')+'</span></div><div class="ad">'+esc(s.a||'无地址')+'</div>'+(s.ph?'<div class="mt"><a href="tel:'+esc(s.ph)+'" onclick="event.stopPropagation()" style="color:var(--green);text-decoration:none;font-weight:600">📞 '+esc(s.ph)+'</a></div>':'')+'<div class="mt">周期'+cy+'天 · 上次'+((lv)?fmt(lv):'无')+'</div></div><div class="sr-acts" onclick="event.stopPropagation()"><button onclick="doCheckin(\''+s.id+'\',\''+esc(s.n)+'\')">⏱ 打卡</button><button onclick="showOrderForm(\''+s.id+'\')">📦 进货</button></div></div>'}el('storeList').innerHTML=html}

function saveStore(id){var n=el('sf_n').value.trim();if(!n){toast('请输入门店名称');return}var s={n:n,a:el('sf_a').value.trim(),ph:el('sf_ph').value.trim(),cy:parseInt(el('sf_cy').value)||30,tier:el('sf_tier').value,cn:el('sf_cn').value.trim(),bd:el('sf_bd').value,pf:el('sf_pf').value.trim(),balance:pf(el('sf_balance').value),ct:now()};if(id){s.id=id;dbGet('s',id,function(old){if(old)s.ct=old.ct;dbPut('s',s,function(){toast('已更新');hideModal();loadStoreList();loadOverview()})})}else{s.id=uid();dbPut('s',s,function(){toast('门店已添加');hideModal();loadStoreList();loadOverview()})}}
function showRechargeForm(sid){var s=null;for(var i=0;i<allStores.length;i++){if(allStores[i].id===sid){s=allStores[i];break}}if(!s)return;var h='<h2>充值 · '+esc(s.n)+'</h2>';h+='<div class="card" style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span style="font-size:12px;color:var(--text-3)">当前余额</span><span style="font-size:20px;font-weight:700;color:var(--green)">'+fm(s.balance||0)+'</span></div></div>';h+='<div class="fg"><label>充值金额 ¥</label><input id="rc_amt" type="number" step="any" value="0" autofocus></div>';h+='<div class="fg"><label>备注</label><input id="rc_nt" placeholder="如微信转账"></div>';h+='<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="doRecharge(\''+sid+'\')">确认充值</button><button class="btn2" style="flex:1" onclick="hideModal()">取消</button></div>';showModal(h)}function doRecharge(sid){var amt=pf(el('rc_amt').value);if(amt<=0){toast('请输入金额');return};dbGet('s',sid,function(s){if(!s)return;s.balance=(s.balance||0)+amt;dbPut('s',s,function(){toast('已充值 '+fm(amt));hideModal();loadOverview();loadStoreList()})})}

function showOrderForm(sid){var storeOpts='<option value="">选择门店</option>';for(var i=0;i<allStores.length;i++)storeOpts+='<option value="'+allStores[i].id+'"'+(sid===allStores[i].id?' selected':'')+'>'+esc(allStores[i].n)+'</option>';var prodOpts='<option value="">-- 选择商品 --</option>';for(var i2=0;i2<PRODUCTS.length;i2++)prodOpts+='<option value="'+esc(PRODUCTS[i2].n)+'">'+esc(PRODUCTS[i2].n)+' (¥'+PRODUCTS[i2].p+')</option>';var h='<h2>📦 记录进货</h2>';h+='<div class="fg"><label>门店 *</label><select id="of_si" onchange="updateOrderFormBalance()">'+storeOpts+'</select></div>';h+='<div class="fg"><label>日期</label><input id="of_dt" type="date" value="'+today()+'"></div>';h+='<div id="of_bal" class="card" style="margin-bottom:8px;font-size:11px"></div>';h+='<div class="fs-div"><div class="fs-line"></div><div class="fs-label">商品明细</div><div class="fs-line"></div></div>';h+='<div id="of_od"><div class="row" id="odr_0"><select id="od_nm0" onchange="onOProdSelect(0)">'+prodOpts+'</select><input placeholder="数量" type="number" id="od_q0" style="width:50px" onchange="calcOTotal()"><input placeholder="单价" type="number" id="od_up0" style="width:60px"><label style="font-size:10px;display:flex;align-items:center;gap:3px;white-space:nowrap"><input type="checkbox" id="od_gf0" onchange="onGiftToggle(0)">赠送</label></div></div>';h+='<button class="btn2 btn-sm" onclick="addORow()" style="margin:4px 0">+ 添加商品</button>';h+='<div class="fg" style="margin-top:4px"><label>进货总金额</label><input id="of_oa" type="number" step="any" value="0"></div>';h+='<div class="fs-div"><div class="fs-line"></div><div class="fs-label">财务</div><div class="fs-line"></div></div>';h+='<div class="fr"><div class="fg"><label>打款金额</label><input id="of_pa" type="number" step="any" value="0"></div><div class="fg"><label>打款方式</label><select id="of_pm"><option>现金</option><option>微信</option><option>支付宝</option><option>银行转账</option><option>未付款</option></select></div></div>';h+='<div class="fg"><label>是否结清</label><select id="of function updateOrderFormBalance(){var sid=el('of_si').value;if(!sid){el('of_bal').innerHTML='';return}dbGet('s',sid,function(s){if(s){el('of_bal').innerHTML='<span style=color:var(--text-3)>充值余额</span> <b style=color:var(--green)>'+fm(s.balance||0)+'</b>'+(s.balance>0?' <span style=color:var(--text-3);font-size:10px>打款金额将从此余额扣除</span>':'')}})}function onGiftToggle(idx){var chk=el('od_gf'+idx);if(!chk)return;var priceEl=el('od_up'+idx);if(chk.checked){if(priceEl)priceEl.value=0}calcOTotal()}function onOProdSelect(idx){var sel=el('od_nm'+idx);if(!sel)return;var prod=findProd(sel.value);if(prod){el('od_up'+idx).value=prod.p;el('od_up'+idx).style.borderColor='var(--green)'}else{el('od_up'+idx).value='';el('od_up'+idx).style.borderColor='var(--rule)'}calcOTotal()}

function delORow(idx){var row=el('odr_'+idx);if(row)row.remove();calcOTotal()}
function calcOTotal(){var total=0,cnt=window._odCount||1;for(var i=0;i<cnt;i++){var qe=el('od_q'+i),ue=el('od_up'+i);if(qe&&ue)total+=pf(qe.value)*pf(ue.value)}if(el('of_oa'))el('of_oa').value=Math.round(total)}
function saveOrder(){var sid=el('of_si').value;if(!sid){toast('请选择门店');return}var od=[],cnt=window._odCount||1;for(var i=0;i<cnt;i++){var nme=el('od_nm'+i);if(!nme||!nme.value.trim())continue;var q=pf(el('od_q'+i)?el('od_q'+i).value:0),up=pf(el('od_up'+i)?el('od_up'+i).value:0),cp=pf(el('od_cp'+i)?el('od_cp'+i).value:0),isGf=el('od_gf'+i)?el('od_gf'+i).checked:false;od.push({nm:nme.value.trim(),q:q,up:up,cp:cp,am:q*up,ct:q*cp,gf:isGf})}var oa=pf(el('of_oa').value),pa=pf(el('of_pa').value),isCl=parseInt(el('of_cl').value);var order={id:uid(),si:sid,dt:el('of_dt').value,od:od,oa:oa,pa:pa,pm:el('of_pm').value,cl:isCl,nt:el('of_nt').value.trim()};dbGet('s',sid,function(s){if(s&&pa>0){s.balance=Math.max(0,(s.balance||0)-pa);dbPut('s',s,function(){})}dbPut('o',order,function(){toast('进货已记录');hideModal();loadOverview();if(curTab==='orders')loadOrders(orderStoreFilter);if(curTab==='stats')loadStats()})})}
showOrderDetail=function(oid){dbGet('o',oid,function(o){if(!o){toast('记录不存在');return}var s2=null;for(var i=0;i<allStores.length;i++){if(allStores[i].id===o.si){s2=allStores[i];break}}var h='<h2>📦 进货详情</h2>';h+='<div class="card"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><b>'+(s2?esc(s2.n):'未知门店')+'</b><span>'+(o.cl?'<span class="badge badge-ok">结清</span>':'<span class="badge badge-ov">未结</span>')+'</span></div>';h+='<div style="font-size:12px;color:var(--text-2)">日期'+fmtDT(o.dt)+'</div>';h+='<div style="font-size:12px;color:var(--text-2)">打款'+fm(o.pa||0)+' ('+esc(o.pm||'')+')</div>';h+='<div style="font-size:12px;color:var(--text-2)">进货总额'+fm(o.oa||0)+'</div></div>';if(o.od&&o.od.length>0){h+='<div class="card"><div class="sec-title" style="margin-top:0">商品明细</div><table class="tb1"><tr><th>品名</th><th>数</th><th>单价</th><th>金额</th></tr>';for(var i2=0;i2<o.od.length;i2++){var od=o.od[i2];h+='<tr><td>'+esc(od.nm)+'</td><td class="n">'+od.q+'</td><td class="n">'+fm(od.up)+'</td><td class="n">'+fm(od.am)+'</td><td class="n">'+fm(od.ct)+'</td><td class="n">'+fm((od.am||0)-(od.ct||0))+'</td></tr>'}h+='</table></div>'}if(o.nt)h+='<div class="card"><div class="sec-title" style="margin-top:0">备注</div><div style="font-size:12px">'+esc(o.nt)+'</div></div>';h+='<button class="btn2" style="width:100%;margin-top:10px" onclick="hideModal()">关闭</button>';showModal(h)})};
function delFeed(type,id){if(!confirm('确定删除此记录'))return;var store=type==='ci'?'c':'o';if(type==='od'){dbGet('o',id,function(o){dbDelete(store,id,function(){if(o&&o.pa>0){dbGet('s',o.si,function(s){if(s){s.balance=(s.balance||0)+o.pa;dbPut('s',s,function(){})}})}toast('已删除');loadOverview();if(curTab==='orders')loadOrders(orderStoreFilter);if(curTab==='stats')loadStats()})})}else{dbDelete(store,id,function(){toast('已删除');loadOverview()})}}
/* ===== STATS ===== */
loadStats=function(tab){if(tab)curStatsTab=tab;dbGetAll('s',function(ss){allStores=ss||[];dbGetAll('c',function(cs){allCheckins=cs||[];dbGetAll('o',function(os){allOrders=os||[];if(!curStatsTab)curStatsTab='product';doRenderStats()})})})};
function doRenderStats(){var h='<div class="seg"><button class="'+(curStatsTab==='overview'?'on':'')+'" onclick="loadStats(\'overview\')">销售总览</button><button class="'+(curStatsTab==='product'?'on':'')+'" onclick="loadStats(\'product\')">商品排行</button><button class="'+(curStatsTab==='single'?'on':'')+'" onclick="loadStats(\'single\')">单品分析</button><button class="'+(curStatsTab==='store'?'on':'')+'" onclick="loadStats(\'store\')">门店明细</button></div>';if(curStatsTab==='overview')h+=buildOv();else if(curStatsTab==='product')h+=buildPr();else if(curStatsTab==='single')h+=buildSp();else if(curStatsTab==='store')h+=buildSr();el('statsContent').innerHTML=h}
var statUnit='month';
function buildUnitBtns(cb){var h='<div class="seg" style="margin-bottom:10px">';h+='<button class="'+(statUnit==='day'?'on':'')+'" onclick="setSU(\'day\','+cb+')">按日</button>';h+='<button class="'+(statUnit==='month'?'on':'')+'" onclick="setSU(\'month\','+cb+')">按月</button>';h+='<button class="'+(statUnit==='year'?'on':'')+'" onclick="setSU(\'year\','+cb+')">按年</button>';h+='</div>';return h}
function setSU(u,cb){statUnit=u;if(cb==1)loadStats('overview');if(cb==2)loadStats('single');if(cb==3)loadStats('store')}
function getKey(dt){if(statUnit==='day')return dt.slice(0,10);if(statUnit==='month')return dt.slice(0,7);return dt.slice(0,4)}
function lblUnit(){return statUnit==='day'?'每日':statUnit==='month'?'每月':'每年'}
var drFrom='',drTo='';
function buildDR(){var h='<div class="fr" style="margin-bottom:10px"><div class="fg" style="flex:1"><input id="dr_from" type="date" value="'+drFrom+'" placeholder="开始日期"></div><div class="fg" style="flex:1"><input id="dr_to" type="date" value="'+drTo+'" placeholder="结束日期"></div><button class="btn2 btn-sm" style="flex-shrink:0" onclick="applyDR()">筛选</button></div>';return h}
function applyDR(){drFrom=el('dr_from').value;drTo=el('dr_to').value;doRenderStats()}
function getFO(){var orders=allOrders;if(drFrom)orders=orders.filter(function(o){return o.dt>=drFrom});if(drTo)orders=orders.filter(function(o){return o.dt<=drTo});return orders.slice()}
function buildOv(){var h=buildDR();h+=buildUnitBtns(1);var orders=getFO();var bk={},tQ=0,tA=0;for(var i=0;i<orders.length;i++){var o=orders[i];if(!o.dt)continue;var k=getKey(o.dt);if(!bk[k])bk[k]={q:0,a:0,n:0};bk[k].n++;if(o.od)for(var j=0;j<o.od.length;j++){bk[k].q+=o.od[j].q||0;bk[k].a+=o.od[j].am||0;tQ+=o.od[j].q||0;tA+=o.od[j].am||0}}var keys=Object.keys(bk).sort().reverse();if(statUnit==='day')keys=keys.slice(0,31);if(keys.length===0)return h+'<div class="emp"><div class="ic">◫</div><p>暂无数据</p></div>';var maxA=0;for(var k2 in bk){if(bk[k2].a>maxA)maxA=bk[k2].a}h+='<div class="sts-bar"><div class="sts-it"><span class="n" style="color:var(--green)">'+tQ+'</span><span class="lb">销量(件)</span></div><div class="sts-it"><span class="n" style="color:var(--red)">'+fm(tA)+'</span><span class="lb">销售额</span></div><div class="sts-it"><span class="n">'+orders.length+'</span><span class="lb">订单数</span></div></div>';h+='<div class="card"><div class="sec-title" style="margin-top:0">'+lblUnit()+'趋势</div>';for(var i2=0;i2<keys.length;i2++){var k=keys[i2],b=bk[k],pct=maxA>0?Math.round(b.a/maxA*100):0;h+='<div class="stat-row"><div class="stat-key">'+k+'</div><div class="stat-bar"><div class="stat-fill" style="width:'+pct+'%"></div></div><div class="stat-val">'+fm(b.a)+' <span class="stat-sub">'+b.q+'件</span></div></div>'}h+='</div>';return h}
function buildPr(){var h=buildDR();var orders=getFO();var pm={};for(var i=0;i<orders.length;i++){var o=orders[i];if(o.od)for(var j=0;j<o.od.length;j++){var od=o.od[j];if(!pm[od.nm])pm[od.nm]={q:0,a:0};pm[od.nm].q+=od.q||0;pm[od.nm].a+=od.am||0}}var ps=[];for(var k in pm)ps.push({n:k,q:pm[k].q,a:pm[k].a});ps.sort(function(a,b){return b.a-a.a});if(ps.length===0)return h+'<div class="emp"><div class="ic">◫</div><p>暂无数据</p></div>';var maxA2=ps[0].a;h+='<div class="card"><div class="sec-title" style="margin-top:0">销售额排行 · '+ps.length+'种商品</div>';for(var i2=0;i2<Math.min(ps.length,25);i2++){var p=ps[i2],pct=maxA2>0?Math.round(p.a/maxA2*100):0;var medal=i2==0?'①':i2==1?'②':i2==2?'③':(i2+1);h+='<div class="stat-row"><div class="stat-key" style="width:30px">'+medal+'</div><div style="flex:1;min-width:0;padding-right:8px"><div style="font-size:11px;font-weight:600">'+esc(p.n)+'</div><div style="font-size:9px;color:var(--text-3)">'+p.q+'件</div></div><div class="stat-bar" style="flex:1.5"><div class="stat-fill" style="width:'+pct+'%"></div></div><div class="stat-val">'+fm(p.a)+'</div></div>'}h+='</div>';return h}
function buildSp(){var h=buildDR();h+=buildUnitBtns(2);var orders=getFO();var products={};for(var i=0;i<orders.length;i++){var o=orders[i];if(o.od)for(var j=0;j<o.od.length;j++){var nm=o.od[j].nm;if(!products[nm])products[nm]=[];products[nm].push({dt:o.dt,q:o.od[j].q||0,a:o.od[j].am||0})}}var pns=Object.keys(products).sort();if(pns.length===0)return h+'<div class="emp"><div class="ic">◫</div><p>暂无数据</p></div>';h+='<div class="fg"><label>选择商品</label><select id="sp_sel" onchange="loadStats(\'single\')">';var selProd=el('sp_sel')?el('sp_sel').value:'';for(var i2=0;i2<pns.length;i2++)h+='<option value="'+esc(pns[i2])+'"'+(selProd===pns[i2]||(!selProd&&i2===0)?' selected':'')+'>'+esc(pns[i2])+'</option>';h+='</select></div>';var pn=selProd||pns[0];var bk={},tQ2=0,tA2=0;if(products[pn])for(var i3=0;i3<products[pn].length;i3++){var d=products[pn][i3],k=getKey(d.dt);if(!bk[k])bk[k]={q:0,a:0};bk[k].q+=d.q;bk[k].a+=d.a;tQ2+=d.q;tA2+=d.a}var keys=Object.keys(bk).sort().reverse();if(statUnit==='day')keys=keys.slice(0,31);h+='<div class="sts-bar"><div class="sts-it"><span class="n" style="color:var(--green)">'+tQ2+'</span><span class="lb">总销量</span></div><div class="sts-it"><span class="n" style="color:var(--red)">'+fm(tA2)+'</span><span class="lb">总金额</span></div></div>';if(keys.length===0){h+='<div style="text-align:center;padding:16px;color:var(--text-3);font-size:12px">该时段无数据</div>'}else{var maxA3=0;for(var k2 in bk){if(bk[k2].a>maxA3)maxA3=bk[k2].a}h+='<div class="card"><div class="sec-title" style="margin-top:0">'+esc(pn)+' · '+lblUnit()+'趋势</div>';for(var i4=0;i4<keys.length;i4++){var k=keys[i4],b=bk[k],pct=maxA3>0?Math.round(b.a/maxA3*100):0;h+='<div class="stat-row"><div class="stat-key">'+k+'</div><div class="stat-bar"><div class="stat-fill" style="width:'+pct+'%"></div></div><div class="stat-val">'+fm(b.a)+' <span class="stat-sub">'+b.q+'件</span></div></div>'}h+='</div>'}return h}
function buildSr(){var h=buildDR();var orders=getFO();var sm={};for(var i=0;i<orders.length;i++){var o=orders[i];if(!sm[o.si])sm[o.si]={q:0,a:0,n:0};sm[o.si].n++;if(o.od)for(var j=0;j<o.od.length;j++){sm[o.si].q+=o.od[j].q||0;sm[o.si].a+=o.od[j].am||0}}var ss=[];for(var k in sm){var s=null;for(var i2=0;i2<allStores.length;i2++){if(allStores[i2].id===k){s=allStores[i2];break}}ss.push({id:k,n:s?s.n:'未知',a:sm[k].a,q:sm[k].q,o:sm[k].n})}ss.sort(function(a,b){return b.a-a.a});if(ss.length===0)return h+'<div class="emp"><div class="ic">◫</div><p>暂无数据</p></div>';var maxA4=ss[0].a;h+='<div class="card"><div class="sec-title" style="margin-top:0">门店销售额排行</div>';for(var i3=0;i3<ss.length;i3++){var st=ss[i3],pct=maxA4>0?Math.round(st.a/maxA4*100):0;h+='<div class="stat-row"><div class="stat-key" style="width:24px">'+(i3+1)+'</div><div style="flex:1;min-width:0;padding-right:8px"><div style="font-size:11px;font-weight:600">'+esc(st.n)+'</div><div style="font-size:9px;color:var(--text-3)">'+st.o+'单 · '+st.q+'件</div></div><div class="stat-bar" style="flex:1.5"><div class="stat-fill" style="width:'+pct+'%"></div></div><div class="stat-val">'+fm(st.a)+'</div></div>'}h+='</div>';return h}
/* ===== SETTINGS ===== */
function showSettings(){var h='<h2>设置</h2>';h+='<div class="fg"><label>提醒天数</label><input id="set_remind" type="number" value="'+SETTINGS.remindDays+'"></div>';h+='<div class="fg"><label>流失系数 (超期=周期×系数)</label><input id="set_churn" type="number" step="any" value="'+SETTINGS.churnMult+'"></div>';h+='<div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="flex:1" onclick="saveSettings()">保存</button><button class="btn2" style="flex:1" onclick="hideModal()">取消</button></div>';h+='<div class="fs-div"><div class="fs-line"></div><div class="fs-label">数据</div><div class="fs-line"></div></div>';h+='<button class="btn2" style="width:100%;margin-bottom:8px" onclick="exportData()">导出数据 (JSON)</button>';h+='<button class="btn" style="width:100%;margin-bottom:8px" onclick="el(\'importFile\').click()">导入数据 (JSON)</button>';h+='<button class="btn3" style="width:100%" onclick="resetData()">清除所有数据</button>';showModal(h)}
function saveSettings(){SETTINGS.remindDays=parseInt(el('set_remind').value)||7;SETTINGS.churnMult=pf(el('set_churn').value)||2;setKV('settings',JSON.stringify(SETTINGS),function(){toast('设置已保存');hideModal();loadOverview()})}
function exportData(){dbGetAll('s',function(ss){dbGetAll('c',function(cs){dbGetAll('o',function(os){var data=JSON.stringify({stores:ss,checkins:cs,orders:os,settings:SETTINGS},null,2);var blob=new Blob([data],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='雯迹_备份_'+now()+'.json';a.click();toast('数据已导出')})})})}
function importData(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(ev){try{var data=JSON.parse(ev.target.result);if(!data.stores&&!data.checkins&&!data.orders){toast('无效的备份文件');return}var tx=db.transaction(['s','c','o','k'],'readwrite');var sStore=tx.objectStore('s'),cStore=tx.objectStore('c'),oStore=tx.objectStore('o');if(data.stores)for(var i=0;i<data.stores.length;i++)sStore.put(data.stores[i]);if(data.checkins)for(var j=0;j<data.checkins.length;j++)cStore.put(data.checkins[j]);if(data.orders)for(var k=0;k<data.orders.length;k++)oStore.put(data.orders[k]);tx.oncomplete=function(){toast('已导入 '+(data.stores?data.stores.length:0)+'店 '+(data.checkins?data.checkins.length:0)+'打卡 '+(data.orders?data.orders.length:0)+'进货');hideModal();loadOverview();loadStoreList();loadOrders();loadStats()}}catch(ex){toast('文件格式错误')}};reader.onerror=function(){toast('读取文件失败')};reader.readAsText(file);e.target.value=''}
function resetData(){if(!confirm('确定清除所有数据此操作不可恢复'))return;var tx=db.transaction(['s','c','o','k'],'readwrite');tx.objectStore('s').clear();tx.objectStore('c').clear();tx.objectStore('o').clear();tx.objectStore('k').clear();tx.oncomplete=function(){toast('数据已清除');hideModal();allStores=[];allCheckins=[];allOrders=[];loadOverview();loadStoreList();loadOrders();loadStats()}}
</script>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"></body>
</html>
