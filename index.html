  /* ============================ 页面：积分 ============================ */
  function viewPoints() {
    var db = state.db, t = today();
    var accs = C.allAccounts(db, t).slice().sort(function (a, b) {
      if (b.points !== a.points) return b.points - a.points;
      return a.name < b.name ? -1 : 1;
    });
    var h = sec('客户积分榜', '积分只能在这里手动加减，单据一分不攒');
    if (!accs.length) h += emptyState('还没有客户，先去客户页加一个');
    else h += '<div class="card list">' + accs.map(function (a) {
      return '<button class="row" data-act="pointsCust" data-id="' + esc(a.customerId) + '">' +
        '<span class="row-main"><b>' + esc(a.name) + '</b><small>余额 ' + money(a.balance) + ' · 欠款 ' + money(a.debt) + '</small></span>' +
        '<span class="row-val"><b class="' + (a.points < 0 ? 'danger' : '') + '">' + a.points + '</b> 分</span></button>';
    }).join('') + '</div>';

    h += sec('手动加减分', '分数可正可负，原因必填');
    h += '<div class="card form">' +
      '<label class="fld"><span>客户</span><select data-k="pt.cid" data-live="1">' +
      customerOptions(fget('pt.cid')) + '</select></label>' +
      '<div class="row2">' +
      '<label class="fld"><span>分数（可负）</span><input type="number" inputmode="numeric" data-k="pt.delta" value="' + esc(fget('pt.delta')) + '" placeholder="例如 100 或 -50"></label>' +
      '<label class="fld"><span>日期</span><input type="date" data-k="pt.date" value="' + esc(fget('pt.date') || today()) + '"></label>' +
      '</div>' +
      '<label class="fld"><span>原因（必填）</span><input data-k="pt.reason" value="' + esc(fget('pt.reason')) + '" placeholder="例如 充值赠送 / 手动修正"></label>' +
      '<div class="card-ft"><button class="btn primary" data-act="savePoints">保存加减分</button></div>' +
      '</div>';

    var flow = [];
    (db.pointLogs || []).forEach(function (x) {
      flow.push({ date: x.date, at: x.at || '', cid: x.customerId, delta: Math.round(C.num(x.delta)), reason: x.reason || '', no: x.no, kind: '手动' });
    });
    (db.docs || []).forEach(function (d) {
      if (d.docType !== '出货' || d.payKind !== '积分' || !(C.num(d.pointsUsed) > 0)) return;
      flow.push({ date: d.date, at: '', cid: d.partnerId, delta: -Math.round(C.num(d.pointsUsed)), reason: '积分单扣分', no: d.no, kind: '单据' });
    });
    if (state.pointsCid) flow = flow.filter(function (x) { return String(x.cid) === String(state.pointsCid); });
    flow.sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      var aa = a.at || '', bb = b.at || '';
      if (aa !== bb) return aa < bb ? 1 : -1;
      return a.no < b.no ? 1 : -1;
    });
    flow = flow.slice(0, 200);
    var cmap = C.customerMap(db);
    var name = state.pointsCid && cmap[state.pointsCid] ? cmap[state.pointsCid].name : '';
    h += sec('积分流水', flow.length + ' 条');
    if (state.pointsCid) {
      h += '<div class="chips-row"><button class="chip on" data-act="pointsClear">只看 ' + esc(name) + ' ×</button></div>';
    }
    h += flow.length ? '<div class="card list flow">' + flow.map(function (x) {
      var who = (cmap[x.cid] || {}).name || '已删除客户';
      return '<div class="flow-row">' +
        '<div class="flow-main"><b>' + esc(who) + '</b><small>' + esc(x.date) + ' · ' + esc(x.reason) + (x.no ? ' · ' + esc(x.no) : '') + '</small></div>' +
        '<div class="flow-delta ' + (x.delta < 0 ? 'neg' : 'pos') + '">' + (x.delta > 0 ? '+' : '') + x.delta + '</div>' +
        '</div>';
    }).join('') + '</div>' : emptyState('还没有积分流水：上面加一笔就会出现在这里');

    return h;
  }

  function customerOptions(cur) {
    var list = state.db.customers || [];

    list.forEach(function (c) {
      out += '<option value="' + esc(c.id) + '"' + (String(cur) === String(c.id) ? ' selected' : '') + '>' +

    var list = (state.db.products || []).filter(function (p) { return onlyActive ? p.active !== false : true; });

    list.forEach(function (p) {
      out += '<option value="' + esc(p.id) + '"' + (String(cur) === String(p.id) ? ' selected' : '') + '>' +

  /* ============================ 弹层 ============================ */
  function sheetHTML() {
    if (!state.modal) return '';
    var m = state.modal;
    var title = { deposit: '充值', receipt: '收款', in: '开进货单', out: '开出货单', count: '改当前库存', price: '改价格' }[m.type] || '';
    var body = '', foot = '', okLabel = '确认';
    if (m.type === 'count') title = '改「' + ((C.findProduct(state.db, m.pid) || {}).name || '') + '」的当前库存';
    if (m.type === 'deposit' || m.type === 'receipt') {
      var isDep = m.type === 'deposit';
      var acc = C.customerAccount(state.db, m.cid, fget('dep.date') || today());
      body = '<div class="who">' + esc((C.findCustomer(state.db, m.cid) || {}).name || '') +
        '<small>当前余额 ' + money(acc.balance) + ' · 欠款 ' + money(acc.debt) + '</small></div>' +
        '<label class="fld"><span>金额（元）</span><input type="number" inputmode="decimal" step="0.01" min="0" data-k="' + (isDep ? 'dep' : 'rc') + '.amount" value="' + esc(fget((isDep ? 'dep' : 'rc') + '.amount')) + '" placeholder="0.00"></label>' +
        '<div class="row2">' +
        '<label class="fld"><span>日期</span><input type="date" data-k="' + (isDep ? 'dep' : 'rc') + '.date" value="' + esc(fget((isDep ? 'dep' : 'rc') + '.date') || today()) + '"></label>' +
        '<label class="fld"><span>备注</span><input data-k="' + (isDep ? 'dep' : 'rc') + '.note" value="' + esc(fget((isDep ? 'dep' : 'rc') + '.note')) + '" placeholder="可不填"></label>' +
        '</div>' +
        '<p class="hint">' + (isDep ? '充值是客户先给你的钱，会加到他的余额里。' : '收款冲减欠款，不会回写出货单上的数字。') + '</p>';
      okLabel = isDep ? '确认充值' : '确认收款';
    } else if (m.type === 'in') {
      var pid = fget('in.pid');
      var p = pid ? C.findProduct(state.db, pid) : null;
      body = '<label class="fld"><span>产品</span><select data-k="in.pid" data-live="1">' + productOptions(pid, true) + '</select></label>' +
        '<div class="row2">' +
        '<label class="fld"><span>数量</span><input type="number" inputmode="decimal" step="0.001" min="0" data-k="in.qty" data-live="1" value="' + esc(fget('in.qty')) + '" placeholder="0"></label>' +
        '<label class="fld"><span>单价（成本价）</span><input value="' + (p ? money(p.costPrice) : '—') + '" disabled></label>' +
        '</div>' +
        '<div class="row2">' +
        '<label class="fld"><span>日期</span><input type="date" data-k="in.date" value="' + esc(fget('in.date') || today()) + '"></label>' +
        '<label class="fld"><span>备注</span><input data-k="in.note" value="' + esc(fget('in.note')) + '" placeholder="可不填"></label>' +
        '</div>' +
        '<p class="hint">进货单价固定取这个产品的成本价，库存会自动 +' + esc(qtyS(C.num(fget('in.qty')))) + '。</p>';
      okLabel = '保存进货单';
    } else if (m.type === 'out') {
      body = viewOutSheet();
      okLabel = '保存出货单';
    } else if (m.type === 'count') {
      var cp = C.findProduct(state.db, m.pid) || {};
      var inv0 = C.inventory(state.db)[m.pid];
      var cur0 = inv0 ? C.qty3(inv0.inHand) : 0;
      body = '<div class="who">' + esc(cp.name || '') +
        '<small>现在在手 ' + qtyS(cur0) + esc(cp.unit || '') + '</small></div>' +
        '<label class="fld"><span>改成多少（整数或 0.5）</span>' +
        '<input type="number" inputmode="decimal" step="0.5" min="0" data-k="ct.qty" value="' + esc(fget('ct.qty')) + '" placeholder="0"></label>' +
        '<p class="hint">改完自动记一张盘点单，不动钱。</p>';
      okLabel = '保存盘点单';
    } else if (m.type === 'price') {
      var pp = C.findProduct(state.db, m.pid) || {};
      var pOn = fget('pf.active') === 'off' ? 'off' : 'on';
      body = '<div class="who">' + esc(pp.name || '') +
        '<small>' + esc(pp.category || '') + (pp.sub ? ' · ' + esc(pp.sub) : '') + ' · ' + esc(pp.unit || '') + '</small></div>' +
        '<div class="row3">' +
        '<label class="fld"><span>成本价</span><input type="number" inputmode="decimal" step="0.01" min="0" data-k="pf.cost" value="' + esc(fget('pf.cost')) + '"></label>' +
        '<label class="fld"><span>门店价</span><input type="number" inputmode="decimal" step="0.01" min="0" data-k="pf.store" value="' + esc(fget('pf.store')) + '"></label>' +
        '<label class="fld"><span>零售价</span><input type="number" inputmode="decimal" step="0.01" min="0" data-k="pf.retail" value="' + esc(fget('pf.retail')) + '"></label>' +
        '</div>' +
        '<div class="seg"><button class="' + (pOn === 'on' ? 'on' : '') + '" data-act="priceActive" data-v="on">在售</button>' +
        '<button class="' + (pOn === 'off' ? 'on' : '') + '" data-act="priceActive" data-v="off">停用</button></div>' +
        '<p class="hint">零售价就是积分单价：积分单按它扣分。改价格不影响已经开出去的单。</p>' +
        '<button class="link danger" data-act="delProduct" data-id="' + esc(m.pid) + '">× 删除这个产品</button>';
      okLabel = '保存价格';
    }
    foot = '<button class="btn ghost" data-act="modalX">取消</button>' +
      '<button class="btn primary" data-act="modalOk"' + (m.type === 'out' && outBlocked() ? ' disabled' : '') + '>' + okLabel + '</button>';
    return '<div class="sheet" data-act="modalClose"><div class="sheet-panel" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +
      '<div class="sheet-hd"><h2>' + esc(title) + '</h2>' +
      '<button class="iconbtn sm" data-act="modalX" aria-label="关闭">' + icon('close', 20) + '</button></div>' +
      '<div class="sheet-body">' + body + '</div>' +
      '<div class="sheet-foot">' + foot + '</div>' +
      '</div></div>';
  }

  function outBlocked() {
    if (!state.outDoc) return true;
    var pv = outPreview();
    return !pv.cid || !pv.lineCount || (pv.payKind === '积分' && pv.insufficient);
  }

  function outPreview() {
    var o = state.outDoc || {};
    var db = state.db;
    var pm = C.productMap(db);
    var amount = 0, lineCount = 0;
    (o.lines || []).forEach(function (l) {
      var p = pm[l.pid];
      if (!p || !(C.num(l.qty) > 0)) return;
      lineCount += 1;
      var price = o.payKind === '积分'
        ? C.num(p.retailPrice)
        : (String(l.price).trim() === '' ? C.tierPrice(p, o.tier) : C.num(l.price));
      amount = C.round2(amount + C.round2(C.num(l.qty) * price));
    });
    var acc = o.cid ? C.customerAccount(db, o.cid, o.date || today()) : { balance: 0, points: 0, debt: 0 };
    var paid = 0, debt = 0, need = 0, insufficient = false;
    if (o.payKind === '积分') {
      need = Math.round(amount);
      insufficient = need > acc.points;
    } else {
      var want = String(o.paid).trim() === '' ? Math.min(acc.balance, amount) : C.num(o.paid);
      paid = C.round2(Math.min(want, amount));
      debt = C.round2(amount - paid);
    }
    return {
      amount: amount, paid: paid, debt: debt, need: need, points: acc.points,
      balance: acc.balance, insufficient: insufficient, cid: !!o.cid, lineCount: lineCount,
      payKind: o.payKind
    };
  }

  function viewOutSheet() {
    var o = state.outDoc;
    var pv = outPreview();
    var cust = o.cid ? C.findCustomer(state.db, o.cid) : null;
    var h = '<div class="seg" role="group" aria-label="单据类型">' +
      '<button class="' + (o.payKind === '余额' ? 'on' : '') + '" data-act="outKind" data-v="余额">余额单</button>' +
      '<button class="' + (o.payKind === '积分' ? 'on' : '') + '" data-act="outKind" data-v="积分">积分单</button></div>';
    h += '<p class="hint">' + (o.payKind === '积分'
      ? '积分单：单价锁零售价，只扣积分，分不够开不了单。'
      : '余额单：价格灵活（门店价 / 折扣档 / 当场改单价），余额不够也能出，差额记这张单的欠款。') + '</p>';
    h += '<label class="fld"><span>客户</span><select data-k="out.cid" data-live="1">' + customerOptions(o.cid) + '</select></label>';
    if (cust) {
      var acc = C.customerAccount(state.db, o.cid, o.date || today());
      h += '<div class="who">' + esc(cust.name) + '<small>现有余额 ' + money(acc.balance) + ' · 积分 ' + acc.points + ' · 欠款 ' + money(acc.debt) + '</small></div>';
    }
    if (o.payKind === '余额') {
      h += '<label class="fld"><span>价格档</span><select data-k="out.tier" data-live="1">' +
        C.DISCOUNT_TIERS.map(function (t) { return '<option' + (o.tier === t ? ' selected' : '') + '>' + esc(t) + '</option>'; }).join('') +
        '</select></label>';
    }
    h += '<div class="lines-edit">';
    o.lines.forEach(function (l, i) {
      var p = l.pid ? C.findProduct(state.db, l.pid) : null;
      var price = p ? (o.payKind === '积分' ? p.retailPrice : (String(l.price).trim() === '' ? C.tierPrice(p, o.tier) : C.num(l.price))) : 0;
      h += '<div class="line-edit">' +
        '<label class="fld"><span>产品</span><select data-li="' + i + '" data-lf="pid" data-live="1">' + productOptions(l.pid, true) + '</select></label>' +
        '<div class="row2">' +
        '<label class="fld"><span>数量</span><input type="number" inputmode="decimal" step="0.001" min="0" data-li="' + i + '" data-lf="qty" data-live="1" value="' + esc(l.qty) + '" placeholder="0"></label>' +
        (o.payKind === '积分'
          ? '<label class="fld"><span>单价（锁零售价）</span><input value="' + (p ? money(p.retailPrice) : '—') + '" disabled></label>'
          : '<label class="fld"><span>单价</span><input type="number" inputmode="decimal" step="0.01" min="0" data-li="' + i + '" data-lf="price" data-live="1" value="' + esc(l.price) + '" placeholder="' + (p ? money(C.tierPrice(p, o.tier)) : '按价格档') + '"></label>') +
        '</div>' +
        (o.lines.length > 1 ? '<button class="link danger" data-act="outDelLine" data-i="' + i + '">× 去掉这行</button>' : '') +
        '</div>';
    });
    h += '</div>';
    h += '<button class="btn ghost sm" data-act="outAddLine">＋ 再加一行</button>';

    if (o.payKind === '积分') {
      h += '<div class="nums">' +
        '<div><small>要扣</small><b class="warn">' + pv.need + ' 分</b></div>' +
        '<div><small>他现在</small><b>' + pv.points + ' 分</b></div>' +
        '<div><small>金额（零售价）</small><b>' + money(pv.amount) + '</b></div>' +
        '</div>';
      if (pv.cid && pv.insufficient) {
        h += '<p class="hint err">他现在 ' + pv.points + ' 分，这单要 ' + pv.need + ' 分</p>';
      }
    } else {
      h += '<label class="fld"><span>从余额扣（可改，清空=自动）</span>' +
        '<input type="number" inputmode="decimal" step="0.01" min="0" data-k="out.paid" data-live="1" value="' +
        esc(o.paid === '' ? String(pv.paid) : o.paid) + '"></label>';
      h += '<div class="nums">' +
        '<div><small>金额</small><b>' + money(pv.amount) + '</b></div>' +
        '<div><small>从余额扣</small><b>' + money(pv.paid) + '</b></div>' +
        '<div><small>欠款</small><b class="' + (pv.debt > 0 ? 'danger' : '') + '">' + money(pv.debt) + '</b></div>' +
        '</div>';
    }

    h += '<label class="fld"><span>日期</span><input type="date" data-k="out.date" value="' + esc(o.date) + '"></label>';
    h += '<label class="fld"><span>备注</span><input data-k="out.note" value="' + esc(o.note) + '" placeholder="可不填"></label>';
    return h;
  }

  /* ============================ 设置 ============================ */
  function viewSettings() {
    if (state.clearStep === 1) return viewClear();
    var db = state.db, b = C.backupStatus(db, today());
    var h = '<main class="main set">';
    h += '<article class="card"><div class="card-hd"><div class="card-ttl">备份与导出</div></div>' +
      '<p class="hint ' + (b.level === 'ok' ? '' : 'err') + '">' + esc(b.text) + '</p>' +
      '<div class="card-ft wrap"><button class="btn ghost" data-act="expJson">导出 JSON</button>' +
      '<button class="btn ghost" data-act="expCsv">导出 CSV（五张表）</button></div>' +
      '<p class="hint">数据只存在这台浏览器里；导出的 JSON 就是你自己的备份。</p></article>';

    h += '<article class="card"><div class="card-hd"><div class="card-ttl">导入</div></div>' +
      '<div class="card-ft wrap"><button class="btn ghost" data-act="impFile">选一个 JSON 文件</button></div>' +
      '<input type="file" id="impFile" accept=".json,application/json" hidden>' +
      '<label class="fld"><span>或者把备份内容粘贴到这里</span><textarea rows="4" data-k="imp.text" placeholder=\'{"version":2,...}\'>' + esc(fget('imp.text')) + '</textarea></label>' +
      '<div class="seg small"><button class="' + (fget('imp.mode') !== 'overwrite' ? 'on' : '') + '" data-act="impMode" data-v="merge">合并</button>' +
      '<button class="' + (fget('imp.mode') === 'overwrite' ? 'on' : '') + '" data-act="impMode" data-v="overwrite">覆盖</button></div>' +
      (fget('imp.mode') === 'overwrite' && state.impStep === 1 ? '<p class="hint err">覆盖会整库换成这份备份，点「确认覆盖导入」才会真的写进去。</p>' : '') +
      '<div class="card-ft"><button class="btn ' + (fget('imp.mode') === 'overwrite' && state.impStep === 1 ? 'danger' : 'primary') + '" data-act="doImport">' + (fget('imp.mode') === 'overwrite' && state.impStep === 1 ? '确认覆盖导入' : '开始导入') + '</button></div>' +
      '<p class="hint">合并：同一 id 以较新的为准，其余追加；覆盖：整库换成这份文件。</p></article>';

    h += '<article class="card"><div class="card-hd"><div class="card-ttl">外观</div></div>' +
      '<div class="seg">' +
      themeBtn('light', '浅色') + themeBtn('dark', '深色') + themeBtn('auto', '跟随系统') +
      '</div></article>';

    h += '<article class="card"><div class="card-hd"><div class="card-ttl">清空</div></div>' +
      '<p class="hint">清空会删掉所有单据、客户、充值、收款、积分流水；<b>产品原样保留</b>。这一步不可撤销，先导出 JSON 更稳。</p>' +
      (state.removed ? '<p class="hint">上次清空：单据 ' + state.removed.docs + ' 张 · 客户 ' + state.removed.customers +
        ' 位 · 充值 ' + state.removed.deposits + ' 笔 · 收款 ' + state.removed.receipts + ' 笔 · 积分 ' + state.removed.pointLogs + ' 条</p>' : '') +
      '<div class="card-ft"><button class="btn danger" data-act="clearStart">开始清空</button></div></article>';

    var edits = C.editLog(db, 20);
    h += '<article class="card"><div class="card-hd"><div class="card-ttl">最近 20 条改动</div></div>' +
      (edits.length ? '<ul class="edits">' + edits.map(function (e) {
        return '<li><span>' + esc(e.what) + '</span><small>' + esc(e.at) + '</small></li>';
      }).join('') + '</ul>' : '<p class="hint">还没有改动记录。</p>') + '</article>';

    h += '<article class="card"><div class="card-hd"><div class="card-ttl">关于</div></div>' +
      '<p class="hint">进销存系统 v2 · 卡片版 · 存储键 ' + esc(C.STORAGE_KEY) + ' · 版本 ' + C.VERSION + '</p>' +
      '<p class="hint">产品 ' + (db.products || []).length + ' 个 · 客户 ' + (db.customers || []).length +
      ' 位 · 单据 ' + (db.docs || []).length + ' 张</p></article>';
    h += '</main>' + navHTML();
    return h;
  }

  function themeBtn(v, label) {
    return '<button class="' + (state.theme === v ? 'on' : '') + '" data-act="theme" data-v="' + v + '">' + label + '</button>';
  }

  function viewClear() {
    var okWord = fget('clear.word').trim() === '清空';
    return '<main class="main set">' +
      '<article class="card danger-zone">' +
      '<div class="card-hd"><div class="card-ttl">确认清空（第二步）</div></div>' +
      '<p>这会删掉：<b>全部单据、全部客户、全部充值 / 收款 / 积分流水</b>。产品保留。</p>' +
      '<p>想反悔的话现在就点「取消」，或者先去导出一次 JSON。</p>' +
      '<label class="fld"><span>在下面输入「清空」两个字</span><input data-k="clear.word" data-live="1" value="' + esc(fget('clear.word')) + '" placeholder="清空"></label>' +
      '<div class="card-ft"><button class="btn ghost" data-act="clearCancel">取消</button>' +
      '<button class="btn danger" data-act="doClear"' + (okWord ? '' : ' disabled') + '>确认清空</button></div>' +
      '</article></main>';
  }

  /* ============================ 页面调度 ============================ */
  function pageBody() {
    switch (state.page) {
      case 'stock': return viewStock();
      case 'price': return viewPrice();
      case 'cust': return viewCust();
      case 'in': return viewIn();
      case 'out': return viewOut();
      case 'points': return viewPoints();
      default: return viewDash();
    }
  }
  function viewShell() {
    return appbar() + bannerHTML() + '<main class="main">' + pageBody() + '</main>' + navHTML() + dockHTML() + sheetHTML();
  }

  /* ============================ 动作 ============================ */
  function go(page) {
    state.page = page;
    state.modal = null;
    state.inDoc = null;
    state.outDoc = null;
    render({ top: true });
  }

  function openDeposit(cid) {
    state.f = { 'dep.amount': '', 'dep.date': today(), 'dep.note': '' };
    state.modal = { type: 'deposit', cid: cid };
    render({ focusModal: true });
  }
  function openReceipt(cid) {
    state.f = { 'rc.amount': '', 'rc.date': today(), 'rc.note': '' };
    state.modal = { type: 'receipt', cid: cid };
    render({ focusModal: true });
  }
  function openIn() {
    state.f = { 'in.pid': '', 'in.qty': '', 'in.date': today(), 'in.note': '' };
    state.modal = { type: 'in' };
    render({ focusModal: true });
  }
  function openOut() {
    state.outDoc = {
      payKind: '余额', cid: '', tier: '门店价', date: today(), note: '', paid: '',
      lines: [{ pid: '', qty: '', price: '' }]
    };
    state.modal = { type: 'out' };
    render({ focusModal: true });
  }
  function openCount(pid) {
    var inv = C.inventory(state.db)[pid];
    state.f = { 'ct.qty': String(inv ? C.qty3(inv.inHand) : 0) };
    state.modal = { type: 'count', pid: pid };
    render({ focusModal: true });
  }
  function openPriceSheet(pid) {
    var p = C.findProduct(state.db, pid);
    if (!p) return;
    state.f = {
      'pf.cost': String(C.num(p.costPrice)),
      'pf.store': String(C.num(p.storePrice)),
      'pf.retail': String(C.num(p.retailPrice)),
      'pf.active': p.active === false ? 'off' : 'on'
    };
    state.modal = { type: 'price', pid: pid };
    render({ focusModal: true });
  }
  function savePriceNow() {
    var m = state.modal;
    var pid = m && m.pid;
    if (!pid) return;
    try {
      var r = C.updateProduct(state.db, pid, {
        costPrice: C.num(fget('pf.cost')),
        storePrice: C.num(fget('pf.store')),
        retailPrice: C.num(fget('pf.retail')),
        active: fget('pf.active') !== 'off'
      });
      commit(r.db, '改价格 ' + r.name);
      closeModal();
      toast('已保存 ' + r.name + ' 的价格');
    } catch (e) { toast(e.message, true); }
  }

  function saveCountNow() {
    var m = state.modal;
    var p = C.findProduct(state.db, m.pid) || {};
    var inv = C.inventory(state.db)[m.pid];
    var cur = inv ? C.qty3(inv.inHand) : 0;
    var raw = String(fget('ct.qty')).trim();
    if (raw === '') { toast('填一个数', true); return; }
    var want = C.qty3(C.num(raw));
    if (!(want >= 0)) { toast('库存不能填成负数', true); return; }
    var delta = C.qty3(want - cur);
    if (delta === 0) { toast('在手已经是 ' + qtyS(cur) + esc(p.unit || '') + '，不用记单'); return; }
    var r = C.saveCount(state.db, { date: today(), note: '库存页改数', lines: [{ productId: m.pid, qty: delta }] });
    if (r.error) { toast(r.message || r.error, true); return; }
    commit(r.db, '盘点 ' + r.doc.no);
    state.modal = null;
    render();
    toast('在手 ' + qtyS(cur) + ' → ' + qtyS(want) + '，已记盘点单 ' + r.doc.no);
  }
  function delCountDoc(id) {
    var d = (state.db.docs || []).filter(function (x) { return x.id === id; })[0];
    if (!d) return;
    var r = C.deleteDoc(state.db, id);
    commit(r.db, '删盘点单 ' + d.no);
    render();
    toast('已删除盘点单 ' + d.no + '，库存已回滚');
  }
  function closeModal() {
    state.modal = null;
    state.outDoc = null;
    render();
  }

  function saveDeposit() {
    var amount = fnum('dep.amount');
    var r = C.addDeposit(state.db, { customerId: state.modal.cid, date: fget('dep.date'), amount: amount, note: fget('dep.note') });
    if (r.error) { toast(r.message || r.error, true); return; }
    commit(r.db, '充值 ' + r.no + ' ' + money(amount));
    var acc = C.customerAccount(state.db, state.modal.cid, today());
    state.modal = null;
    render();
    toast('已充值 ' + money(amount) + '（' + r.no + '）：余额 ' + money(acc.balance) + ' · 欠款 ' + money(acc.debt));
  }
  function saveReceipt() {
    var amount = fnum('rc.amount');
    var r = C.addReceipt(state.db, { customerId: state.modal.cid, date: fget('rc.date'), amount: amount, note: fget('rc.note') });
    if (r.error) { toast(r.message || r.error, true); return; }
    commit(r.db, '收款 ' + r.no + ' ' + money(amount));
    var acc = C.customerAccount(state.db, state.modal.cid, today());
    state.modal = null;
    render();
    toast('已收款 ' + money(amount) + '（' + r.no + '）：欠款 ' + money(acc.debt) +
      (r.over ? ' · 收的比欠款多' : ''));
  }
  function saveIn() {
    var pid = fget('in.pid');
    var qty = fnum('in.qty');
    if (!pid) { toast('先选产品', true); return; }
    if (!(qty > 0)) { toast('数量要大于 0', true); return; }
    var r = C.saveInDoc(state.db, {
      date: fget('in.date'), partnerName: '总部', note: fget('in.note'),
      lines: [{ productId: pid, qty: qty }]
    });
    if (r.error) { toast(r.message || r.error, true); return; }
    commit(r.db, '进货 ' + r.doc.no);
    var t = C.docTotals(state.db, r.doc);
    state.modal = null;
    render();
    toast('已开进货单 ' + r.doc.no + '：' + money(t.amount));
  }
  function saveOut() {
    var o = state.outDoc;
    if (!o.cid) { toast('先选客户', true); return; }
    var lines = [];
    o.lines.forEach(function (l) {
      if (!l.pid || !(C.num(l.qty) > 0)) return;
      var row = { productId: l.pid, qty: C.qty3(l.qty) };
      if (o.payKind === '余额' && String(l.price).trim() !== '') row.unitPrice = C.num(l.price);
      lines.push(row);
    });
    if (!lines.length) { toast('这一单还没有产品行', true); return; }
    var cust = C.findCustomer(state.db, o.cid) || {};
    var draft = {
      date: o.date, partnerId: o.cid, partnerName: cust.name || '',
      payKind: o.payKind, discountTier: o.tier, note: o.note, lines: lines
    };
    if (o.payKind === '余额' && String(o.paid).trim() !== '') draft.paidFromBalance = C.num(o.paid);
    var r = C.saveOutDoc(state.db, draft);
    if (r.error) { toast(r.message || r.error, true); return; }
    commit(r.db, '出货 ' + r.doc.no);
    var t = C.docTotals(state.db, r.doc);
    state.modal = null;
    state.outDoc = null;
    render();
    toast('已开出货单 ' + r.doc.no + '：金额 ' + money(t.amount) +
      (r.doc.payKind === '积分' ? ' · 扣 ' + r.doc.pointsUsed + ' 分'
        : ' · 扣余额 ' + money(r.doc.paidFromBalance) + ' · 欠 ' + money(r.doc.debt)));
  }
  function savePoints() {
    var cid = fget('pt.cid');
    var delta = fnum('pt.delta');
    var reason = fget('pt.reason');
    if (!cid) { toast('先选客户', true); return; }
    var r = C.pointAdjust(state.db, { customerId: cid, date: fget('pt.date') || today(), delta: delta, reason: reason });
    if (r.error) { toast(r.message || r.error, true); return; }
    commit(r.db, '积分 ' + r.no + ' ' + (delta > 0 ? '+' : '') + delta);
    var acc = C.customerAccount(state.db, cid, today());
    state.f['pt.delta'] = '';
    state.f['pt.reason'] = '';
    render();
    toast('积分已' + (delta > 0 ? '增加' : '扣减') + ' ' + Math.abs(delta) + ' 分（' + r.no + '）：他现在 ' + acc.points + ' 分' +
      (r.negativeAfter ? ' · 已经扣成负分' : ''));
  }

  function saveNewCust() {
    var name = fget('nc.name').trim();
    if (!name) { toast('客户名字不能为空', true); return; }
    try {
      var r = C.addCustomer(state.db, { name: name, note: fget('nc.note') });
      commit(r.db, '新建客户 ' + r.name);
      state.newCust = false;
      state.f['nc.name'] = '';
      state.f['nc.note'] = '';
      render();
      toast('已新建客户 ' + r.name);
    } catch (e) { toast(e.message, true); }
  }
  function saveNewProduct() {
    var name = fget('np.name').trim();
    if (!name) { toast('产品名字不能为空', true); return; }
    try {
      var r = C.addProduct(state.db, {
        name: name,
        category: fget('np.cat') || C.CATEGORIES[0],
        unit: fget('np.unit') || C.UNITS[0],
        costPrice: fnum('np.cost'), storePrice: fnum('np.store'), retailPrice: fnum('np.retail')
      });
      commit(r.db, '新建产品 ' + r.name);
      state.newProduct = false;
      ['np.name', 'np.cost', 'np.store', 'np.retail'].forEach(function (k) { state.f[k] = ''; });
      render();
      toast('已新建产品 ' + r.name);
    } catch (e) { toast(e.message, true); }
  }

  function savePrice(el) {
    var id = el.getAttribute('data-id');
    var fd = el.getAttribute('data-fd');
    var val = C.num(el.value);
    var p = C.findProduct(state.db, id);
    if (!p) return;
    if (C.eq(p[fd], val)) { render(); return; }
    try {
      var fields = {};
      fields[fd] = val;
      var r = C.updateProduct(state.db, id, fields);
      commit(r.db, '改价 ' + r.name + ' ' + fd + ' ' + money(val));
      render();
      toast('已保存：' + r.name + ' ' + labelOfPrice(fd) + ' ' + money(val));
    } catch (e) { toast(e.message, true); render(); }
  }
  function labelOfPrice(f) {
    return { costPrice: '成本价', storePrice: '门店价', retailPrice: '零售价' }[f] || f;
  }

  function saveCustNote(el) {
    var id = el.getAttribute('data-id');
    try {
      var r = C.updateCustomer(state.db, id, { note: el.value });
      commit(r.db, '客户备注 ' + r.name);
      render();
    } catch (e) { toast(e.message, true); }
  }

  function toggleCust(id) {
    var c = C.findCustomer(state.db, id);
    if (!c) return;
    try {
      var r = C.updateCustomer(state.db, id, { active: c.active === false });
      commit(r.db, (c.active === false ? '启用客户 ' : '停用客户 ') + r.name);
      render();
      toast((c.active === false ? '已启用 ' : '已停用 ') + r.name);
    } catch (e) { toast(e.message, true); }
  }
  function delProduct(id) {
    try {
      var r = C.removeProduct(state.db, id);
      commit(r.db, (r.mode === 'deleted' ? '删除产品 ' : '停用产品 ') + r.name);
      state.modal = null;
      render();
      toast(r.mode === 'deleted' ? '已删除产品 ' + r.name : '这个产品有 ' + r.docCount + ' 张单据，已改成停用');
    } catch (e) { toast(e.message, true); }
  }
  function delCust(id) {
    try {
      var r = C.removeCustomer(state.db, id);
      commit(r.db, (r.mode === 'deleted' ? '删除客户 ' : '停用客户 ') + r.name);
      render();
      toast(r.mode === 'deleted' ? '已删除客户 ' + r.name : '这个客户有 ' + r.docCount + ' 条往来，已改成停用');
    } catch (e) { toast(e.message, true); }
  }

  function doExportJson() {
    var d = today();
    download('xh-jxc-' + d + '.json', JSON.stringify(state.db, null, 2), 'application/json;charset=utf-8');
    state.db = C.touchBackup(state.db, d);
    rawSave(state.db);
    render();
    toast('已导出备份，并把今天记为备份日');
  }
  function doExportCsv() {
    var r = C.buildCsv(state.db, today());
    download(r.name, r.text, 'text/csv;charset=utf-8');
    toast('已导出 ' + r.name);
  }
  function doImport() {
    var text = fget('imp.text').trim();
    if (!text) { toast('先选文件或粘贴备份内容', true); return; }
    var parsed;
    try { parsed = C.parseDb(text); } catch (e) { toast('这份内容不是有效备份：' + e.message, true); return; }
    if (!parsed || !Array.isArray(parsed.products)) { toast('这份内容里没有可导入的数据', true); return; }
    if (parsed.version !== C.VERSION) { toast('备份版本不对：需要 v' + C.VERSION, true); return; }
    var mode = fget('imp.mode') === 'overwrite' ? 'overwrite' : 'merge';
    if (mode === 'overwrite' && state.impStep !== 1) {
      state.impStep = 1;
      render();
      toast('覆盖会整库替换；再点一次「确认覆盖导入」才会写进去', true);
      return;
    }
    var merged;
    try { merged = C.mergeDb(state.db, text, mode); } catch (e) { toast('导入失败：' + e.message, true); return; }
    commit(merged, '导入备份（' + (mode === 'overwrite' ? '覆盖' : '合并') + '）');
    state.f['imp.text'] = '';
    state.impStep = 0;
    render();
    toast('已导入：产品 ' + merged.products.length + ' 个 · 客户 ' + merged.customers.length + ' 位 · 单据 ' + merged.docs.length + ' 张');
  }
  function doClear() {
    if (fget('clear.word').trim() !== '清空') { toast('请输入「清空」两个字', true); return; }
    var r = C.clearBooks(state.db);
    commit(r.db, '清空账本');
    state.removed = r.removed;
    state.clearStep = 0;
    state.f['clear.word'] = '';
    render({ top: true });
    toast('已清空：客户 ' + r.removed.customers + ' 位 · 单据 ' + r.removed.docs + ' 张 · 充值 ' + r.removed.deposits +
      ' 笔 · 收款 ' + r.removed.receipts + ' 笔 · 积分 ' + r.removed.pointLogs + ' 条；产品都留着');
  }

  /* ============================ 事件 ============================ */
  function onClick(ev) {
    var t = ev.target;
    var el = t && t.closest ? t.closest('[data-act]') : null;
    if (!el || !app.contains(el)) return;
    var act = el.getAttribute('data-act');
    var id = el.getAttribute('data-id');
    var v = el.getAttribute('data-v');

    if (act === 'modalClose') {
      if (t && t.closest && t.closest('.sheet-panel')) return;
      closeModal();
      return;
    }

    switch (act) {
      case 'modalX': closeModal(); break;
      case 'nav': go(v); break;
      case 'set': state.page = SET; state.clearStep = 0; state.modal = null; render({ top: true }); break;
      case 'backSet': state.page = SET; state.clearStep = 0; render({ top: true }); break;
      case 'theme':
        state.theme = C.normTheme(v);
        saveTheme();
        applyTheme();
        render();
        break;
      case 'closeBanner': state.bannerHidden = true; render(); break;
      case 'goCust': {
        var c = C.findCustomer(state.db, id);
        state.f['custQ'] = c ? c.name : '';
        state.page = 'cust';
        render({ top: true });
        break;
      }
      case 'goStock': {
        var p = C.findProduct(state.db, id);
        state.f['stockQ'] = p ? p.name : '';
        state.page = 'stock';
        render({ top: true });
        break;
      }
      case 'stockCount': openCount(id); break;
      case 'delCount': delCountDoc(id); break;
      case 'toggleLow':
        state.f['stockLow'] = state.f['stockLow'] === '1' ? '' : '1';
        render();
        break;
      case 'toggleInactive':
        state.f['showInactive'] = state.f['showInactive'] ? '' : '1';
        render();
        break;
      case 'newCust':
        state.newCust = true;
        state.f['nc.name'] = '';
        state.f['nc.note'] = '';
        render();
        focusSel('[data-k="nc.name"]');
        break;
      case 'cancelNewCust': state.newCust = false; render(); break;
      case 'saveNewCust': saveNewCust(); break;
      case 'newProduct':
        state.newProduct = true;
        ['np.name', 'np.cost', 'np.store', 'np.retail'].forEach(function (k) { state.f[k] = ''; });
        state.f['np.cat'] = C.CATEGORIES[0];
        state.f['np.unit'] = C.UNITS[0];
        render();
        focusSel('[data-k="np.name"]');
        break;
      case 'cancelNewProduct': state.newProduct = false; render(); break;
      case 'saveNewProduct': saveNewProduct(); break;
      case 'priceOpen': openPriceSheet(id); break;
      case 'priceActive':
        state.f['pf.active'] = v === 'off' ? 'off' : 'on';
        render();
        break;
      case 'toggleCust': toggleCust(id); break;
      case 'delProduct': delProduct(id); break;
      case 'delCust': delCust(id); break;
      case 'deposit': openDeposit(id); break;
      case 'receipt': openReceipt(id); break;
      case 'openIn': openIn(); break;
      case 'openOut': openOut(); break;
      case 'modalOk':
        if (!state.modal) break;
        if (state.modal.type === 'deposit') saveDeposit();
        else if (state.modal.type === 'receipt') saveReceipt();
        else if (state.modal.type === 'in') saveIn();
        else if (state.modal.type === 'out') saveOut();
        else if (state.modal.type === 'count') saveCountNow();
        else if (state.modal.type === 'price') savePriceNow();
        break;
      case 'outKind':
        state.outDoc.payKind = v === '积分' ? '积分' : '余额';
        state.outDoc.paid = '';
        state.outDoc.lines.forEach(function (l) { l.price = ''; });
        render();
        break;
      case 'outAddLine':
        state.outDoc.lines.push({ pid: '', qty: '', price: '' });
        render();
        break;
      case 'outDelLine': {
        var i = C.num(el.getAttribute('data-i'));
        state.outDoc.lines.splice(i, 1);
        if (!state.outDoc.lines.length) state.outDoc.lines.push({ pid: '', qty: '', price: '' });
        render();
        break;
      }
      case 'pointsCust': state.pointsCid = String(id); render(); break;
      case 'pointsClear': state.pointsCid = ''; render(); break;
      case 'savePoints': savePoints(); break;
      case 'expJson': doExportJson(); break;
      case 'expCsv': doExportCsv(); break;
      case 'impFile': {
        var fi = document.getElementById('impFile');
        if (fi) fi.click();
        break;
      }
      case 'impMode':
        state.f['imp.mode'] = v === 'overwrite' ? 'overwrite' : 'merge';
        state.impStep = 0;
        render();
        break;
      case 'doImport': doImport(); break;
      case 'clearStart': state.clearStep = 1; state.f['clear.word'] = ''; render({ top: true }); break;
      case 'clearCancel': state.clearStep = 0; state.f['clear.word'] = ''; render({ top: true }); break;
      case 'doClear': doClear(); break;
      default: break;
    }
  }

  function focusSel(sel) {
    var el = app.querySelector(sel);
    if (el) { try { el.focus({ preventScroll: false }); } catch (e) {} }
  }

  function syncOutField(k, value) {
    if (!k || !state.outDoc || k.indexOf('out.') !== 0) return;
    var field = k.slice(4);
    if (field === 'cid' || field === 'tier' || field === 'date' || field === 'note' || field === 'paid') state.outDoc[field] = value;
  }

  function onInput(ev) {
    var el = ev.target;
    if (!el || !el.getAttribute) return;
    var k = el.getAttribute('data-k');
    if (k) { state.f[k] = el.value; syncOutField(k, el.value); }
    var li = el.getAttribute('data-li');
    var lf = el.getAttribute('data-lf');
    if (li != null && lf && state.outDoc && state.outDoc.lines[+li]) state.outDoc.lines[+li][lf] = el.value;
    if (el.getAttribute('data-live') === '1') render();
  }

  function onChange(ev) {
    var el = ev.target;
    if (!el || !el.getAttribute) return;
    var k = el.getAttribute('data-k');
    if (k) { state.f[k] = el.value; syncOutField(k, el.value); }
    var li = el.getAttribute('data-li');
    var lf = el.getAttribute('data-lf');
    if (li != null && lf && state.outDoc && state.outDoc.lines[+li]) state.outDoc.lines[+li][lf] = el.value;
    var act = el.getAttribute('data-act');
    if (act === 'price') { savePrice(el); return; }
    if (act === 'custNote') { saveCustNote(el); return; }
    if (el.getAttribute('data-live') === '1') render();
  }

  function onKey(ev) {
    if (ev.key === 'Escape' && state.modal) { closeModal(); return; }
    if (ev.key === 'Enter' && ev.target && ev.target.tagName === 'INPUT') {
      ev.preventDefault();
      try { ev.target.blur(); } catch (e) {}
    }
  }

  /* ============================ 启动 ============================ */
  function boot() {
    state.db = loadDb();
    state.theme = loadTheme();
    applyTheme();
    if (mq) {
      var onChangeMq = function () { if (state.theme === 'auto') applyTheme(); };
      if (mq.addEventListener) mq.addEventListener('change', onChangeMq);
      else if (mq.addListener) mq.addListener(onChangeMq);
    }
    var tst = document.createElement('div');
    tst.id = 'toast';
    tst.className = 'toast';
    document.body.appendChild(tst);

    document.addEventListener('click', onClick, false);
    document.addEventListener('input', onInput, false);
    document.addEventListener('change', onChange, false);
    document.addEventListener('keydown', onKey, false);
    document.addEventListener('change', function (ev) {
      var el = ev.target;
      if (el && el.id === 'impFile' && el.files && el.files[0]) {
        var fr = new FileReader();
        fr.onload = function () {
          state.f['imp.text'] = String(fr.result || '');
          render();
          toast('已读入文件，点「开始导入」');
        };
        fr.onerror = function () { toast('读不了这个文件', true); };
        fr.readAsText(el.files[0], 'utf-8');
      }
    }, false);

    render({ top: true });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, false);
  else boot();
})();

</script>
<script>
(function(){
  if (!("serviceWorker" in navigator)) return;
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("./sw.js").then(function(r){ window.__swReg = r; }).catch(function(){});
  });
  window.__installHint = function(){ return matchMedia("(display-mode: standalone)").matches; };
})();
</script>
